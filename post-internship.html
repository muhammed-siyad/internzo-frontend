<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Post Internship - INTERNZO</title>

    <link rel="stylesheet"
        href="css/dashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =========================================
           PAGE CONTAINER
        ========================================= */

        .form-container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }


        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {
            margin-bottom: 30px;
        }

        .page-label {
            color: #8b5cf6;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .page-header h1 {
            color: #ffffff;
            font-size: clamp(36px, 5vw, 48px);
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
        }

        .page-header p {
            color: #a1a1aa;
            font-size: 15px;
            line-height: 1.6;
        }


        /* =========================================
           FORM BOX
        ========================================= */

        .form-box {
            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.25);

            animation:
                formAppear 0.35s ease both;
        }


        @keyframes formAppear {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================
           FORM SECTION
        ========================================= */

        .form-section {
            margin-bottom: 32px;
        }

        .form-section:last-of-type {
            margin-bottom: 10px;
        }

        .form-section h2 {
            display: flex;
            align-items: center;
            gap: 10px;

            color: #ffffff;

            font-size: 18px;

            margin-bottom: 22px;

            padding-bottom: 12px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.07);
        }

        .form-section h2 i {
            color: #8b5cf6;
            font-size: 16px;
        }


        /* =========================================
           FORM ROW
        ========================================= */

        .form-row {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }


        /* =========================================
           FORM GROUP
        ========================================= */

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;

            color: #d4d4d8;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        /* =========================================
           INPUTS
        ========================================= */

        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;

            padding: 13px 14px;

            background: #101010;

            color: #ffffff;

            border:
                1px solid
                rgba(255, 255, 255, 0.09);

            border-radius: 10px;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            transition: 0.2s ease;

        }


        /* =========================================
           PLACEHOLDER
        ========================================= */

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #71717a;
        }


        /* =========================================
           SELECT
        ========================================= */

        .form-group select {
            cursor: pointer;
        }

        .form-group select option {
            background: #101010;
            color: #ffffff;
        }


        /* =========================================
           FOCUS
        ========================================= */

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px
                rgba(124, 58, 237, 0.12);

        }


        /* =========================================
           TEXTAREA
        ========================================= */

        .form-group textarea {

            min-height: 120px;

            resize: vertical;

            line-height: 1.6;

        }


        /* =========================================
           DATE INPUT
        ========================================= */

        .form-group input[type="date"] {
            color-scheme: dark;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        #message {

            min-height: 20px;

            margin-bottom: 20px;

            text-align: center;

            color: #a1a1aa;

            font-size: 14px;

            font-weight: 600;

            line-height: 1.5;

        }


        /* =========================================
           BUTTON ROW
        ========================================= */

        .button-row {

            display: flex;

            gap: 12px;

            margin-top: 25px;

        }


        .button-row button {

            width: auto;

            min-height: 46px;

            padding:
                0 24px;

        }


        /* =========================================
           POST BUTTON
        ========================================= */

        .post-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            background: #7c3aed;

            color: #ffffff;

            border: none;

            border-radius: 11px;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }

        .post-btn:hover {

            background: #6d28d9;

            transform:
                translateY(-2px);

        }

        .post-btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================================
           CANCEL BUTTON
        ========================================= */

        .cancel-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            background: #151515;

            color: #d4d4d8;

            border:
                1px solid
                rgba(255, 255, 255, 0.09);

            border-radius: 11px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;

        }

        .cancel-btn:hover {

            background: #1c1c1c;

            color: #ffffff;

            border-color:
                rgba(255, 255, 255, 0.15);

            transform:
                translateY(-2px);

        }


        /* =========================================
           AUTOFILL
        ========================================= */

        .form-group input:-webkit-autofill,
        .form-group input:-webkit-autofill:hover,
        .form-group input:-webkit-autofill:focus {

            -webkit-text-fill-color: #ffffff;

            -webkit-box-shadow:
                0 0 0 1000px #101010 inset;

            transition:
                background-color
                5000s ease-in-out 0s;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 650px) {

            .form-row {

                grid-template-columns: 1fr;

                gap: 0;

            }

            .form-box {

                padding: 22px;

            }

            .button-row {

                flex-direction: column;

            }

            .button-row button {

                width: 100%;

            }

            .page-header h1 {

                font-size: 36px;

            }

        }


        @media (max-width: 380px) {

            .form-box {

                padding: 18px;

            }

            .page-header h1 {

                font-size: 32px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            INTERNZO
        </div>


        <div class="nav-links">

            <a href="company-dashboard.html">
                Dashboard
            </a>

            <a
                href="post-internship.html"
                class="active">

                Post Internship

            </a>

            <a href="manage-internships.html">
                My Internships
            </a>

            <a href="company-applications.html">
                Applications
            </a>

            <a href="company-profile.html">
                Profile
            </a>

            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="dashboard-container">

        <div class="form-container">


            <!-- PAGE HEADER -->

            <div class="page-header">

                <div class="page-label">
                    COMPANY PORTAL
                </div>

                <h1>
                    Post <span style="color:#8b5cf6;">Internship</span>
                </h1>

                <p>
                    Create a new internship opportunity for students.
                </p>

            </div>


            <!-- =========================================
                 FORM BOX
            ========================================= -->

            <div class="form-box">

                <div id="message"></div>


                <form id="internshipForm">


                    <!-- =====================================
                         BASIC INFORMATION
                    ===================================== -->

                    <div class="form-section">

                        <h2>

                            <i class="fa-solid fa-briefcase"></i>

                            Basic Information

                        </h2>


                        <!-- TITLE -->

                        <div class="form-group">

                            <label for="title">
                                Internship Title *
                            </label>

                            <input
                                type="text"
                                id="title"
                                placeholder="Example: Web Development Intern"
                                required
                            >

                        </div>


                        <!-- COMPANY -->

                        <div class="form-group">

                            <label for="companyName">
                                Company Name *
                            </label>

                            <input
                                type="text"
                                id="companyName"
                                placeholder="Enter company name"
                                required
                            >

                        </div>


                        <!-- LOCATION + TYPE -->

                        <div class="form-row">


                            <div class="form-group">

                                <label for="location">
                                    Location *
                                </label>

                                <input
                                    type="text"
                                    id="location"
                                    placeholder="Example: Mangalore / Remote"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="type">
                                    Internship Type *
                                </label>

                                <select
                                    id="type"
                                    required
                                >

                                    <option value="">
                                        Select type
                                    </option>

                                    <option value="Full Time">
                                        Full Time
                                    </option>

                                    <option value="Part Time">
                                        Part Time
                                    </option>

                                    <option value="Remote">
                                        Remote
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>


                    <!-- =====================================
                         INTERNSHIP DETAILS
                    ===================================== -->

                    <div class="form-section">

                        <h2>

                            <i class="fa-solid fa-file-lines"></i>

                            Internship Details

                        </h2>


                        <!-- DURATION + STIPEND -->

                        <div class="form-row">


                            <div class="form-group">

                                <label for="duration">
                                    Duration *
                                </label>

                                <select
                                    id="duration"
                                    required
                                >

                                    <option value="">
                                        Select duration
                                    </option>

                                    <option value="1 Month">
                                        1 Month
                                    </option>

                                    <option value="2 Months">
                                        2 Months
                                    </option>

                                    <option value="3 Months">
                                        3 Months
                                    </option>

                                    <option value="6 Months">
                                        6 Months
                                    </option>

                                </select>

                            </div>


                            <div class="form-group">

                                <label for="stipend">
                                    Stipend
                                </label>

                                <input
                                    type="text"
                                    id="stipend"
                                    placeholder="Example: ₹8,000/month"
                                >

                            </div>

                        </div>


                        <!-- DEADLINE -->

                        <div class="form-group">

                            <label for="deadline">
                                Application Deadline *
                            </label>

                            <input
                                type="date"
                                id="deadline"
                                required
                            >

                        </div>


                        <!-- SKILLS -->

                        <div class="form-group">

                            <label for="skills">
                                Required Skills
                            </label>

                            <input
                                type="text"
                                id="skills"
                                placeholder="Example: HTML, CSS, JavaScript, Git"
                            >

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="form-group">

                            <label for="description">
                                Internship Description *
                            </label>

                            <textarea
                                id="description"
                                placeholder="Describe the internship role and responsibilities..."
                                required
                            ></textarea>

                        </div>


                        <!-- REQUIREMENTS -->

                        <div class="form-group">

                            <label for="requirements">
                                Requirements
                            </label>

                            <textarea
                                id="requirements"
                                placeholder="Example: Basic knowledge of HTML, CSS and JavaScript..."
                            ></textarea>

                        </div>

                    </div>


                    <!-- =====================================
                         BUTTONS
                    ===================================== -->

                    <div class="button-row">

                        <button
                            type="submit"
                            class="post-btn"
                            id="postButton">

                            <i class="fa-solid fa-paper-plane"></i>

                            Post Internship

                        </button>


                        <button
                            type="button"
                            class="cancel-btn"
                            onclick="window.location.href='company-dashboard.html'">

                            <i class="fa-solid fa-xmark"></i>

                            Cancel

                        </button>

                    </div>


                </form>

            </div>

        </div>

    </main>


    <!-- =========================================
         API HELPER
    ========================================= -->

    <script src="js/api.js"></script>


    <script>

        // =========================================
        // CHECK LOGIN
        // =========================================

        const token =
            localStorage.getItem("token");

        const userData =
            localStorage.getItem("user");


        if (!token || !userData) {

            window.location.href =
                "login.html";

        }


        // =========================================
        // USER
        // =========================================

        let user = null;


        try {

            user =
                JSON.parse(userData);

        } catch (error) {

            console.error(
                "User data error:",
                error
            );

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "login.html";

        }


        // =========================================
        // CHECK COMPANY ROLE
        // =========================================

        if (
            user &&
            user.role !== "company"
        ) {

            if (user.role === "student") {

                window.location.href =
                    "student-dashboard.html";

            } else if (
                user.role === "admin"
            ) {

                window.location.href =
                    "admin-dashboard.html";

            } else {

                window.location.href =
                    "login.html";

            }

        }


        // =========================================
        // AUTO FILL COMPANY NAME
        // =========================================

        if (user) {

            document.getElementById(
                "companyName"
            ).value =
                user.name || "";

        }


        // =========================================
        // FORM SUBMIT
        // =========================================

        document
            .getElementById("internshipForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const message =
                        document.getElementById(
                            "message"
                        );


                    const postButton =
                        document.getElementById(
                            "postButton"
                        );


                    // =================================
                    // GET VALUES
                    // =================================

                    const title =
                        document.getElementById(
                            "title"
                        ).value.trim();


                    const companyName =
                        document.getElementById(
                            "companyName"
                        ).value.trim();


                    const location =
                        document.getElementById(
                            "location"
                        ).value.trim();


                    const type =
                        document.getElementById(
                            "type"
                        ).value;


                    const duration =
                        document.getElementById(
                            "duration"
                        ).value;


                    const stipend =
                        document.getElementById(
                            "stipend"
                        ).value.trim();


                    const deadline =
                        document.getElementById(
                            "deadline"
                        ).value;


                    const skills =
                        document.getElementById(
                            "skills"
                        ).value.trim();


                    const description =
                        document.getElementById(
                            "description"
                        ).value.trim();


                    const requirements =
                        document.getElementById(
                            "requirements"
                        ).value.trim();


                    // =================================
                    // VALIDATION
                    // =================================

                    if (
                        !title ||
                        !companyName ||
                        !location ||
                        !type ||
                        !duration ||
                        !deadline ||
                        !description
                    ) {

                        message.style.color =
                            "#f87171";

                        message.textContent =
                            "Please fill all required fields.";

                        return;

                    }


                    try {

                        // =============================
                        // LOADING
                        // =============================

                        postButton.disabled =
                            true;

                        postButton.innerHTML = `
                            <i class="fa-solid fa-spinner fa-spin"></i>
                            Posting...
                        `;

                        message.textContent =
                            "";


                        // =============================
                        // API REQUEST
                        // =============================

                        await apiFetch(
                            "/api/internships",
                            {
                                method: "POST",

                                body:
                                    JSON.stringify({

                                        title:
                                            title,

                                        companyName:
                                            companyName,

                                        location:
                                            location,

                                        type:
                                            type,

                                        duration:
                                            duration,

                                        stipend:
                                            stipend ||
                                            "Unpaid",

                                        deadline:
                                            deadline,

                                        skills:
                                            skills,

                                        description:
                                            description,

                                        requirements:
                                            requirements

                                    })
                            }
                        );


                        // =============================
                        // SUCCESS
                        // =============================

                        message.style.color =
                            "#4ade80";

                        message.textContent =
                            "Internship posted successfully!";


                        // Reset form

                        document
                            .getElementById(
                                "internshipForm"
                            )
                            .reset();


                        // Put company name back

                        document.getElementById(
                            "companyName"
                        ).value =
                            user.name || "";


                        // Clear internship cache

                        if (
                            typeof clearInternshipCache ===
                            "function"
                        ) {

                            clearInternshipCache();

                        }


                    } catch (error) {

                        console.error(
                            "Post internship error:",
                            error
                        );


                        message.style.color =
                            "#f87171";

                        message.textContent =
                            error.message ||
                            "Unable to post internship.";

                    } finally {

                        postButton.disabled =
                            false;

                        postButton.innerHTML = `
                            <i class="fa-solid fa-paper-plane"></i>
                            Post Internship
                        `;

                    }

                }
            );


        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "login.html";

        }

    </script>

</body>

</html>
