<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>INTERNZO - My Applications</title>

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {
            margin-bottom: 30px;
        }

        .page-label {
            color: #8b5cf6;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .page-header h1 {
            color: #ffffff;
            font-size: clamp(36px, 5vw, 48px);
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
        }

        .page-header h1 span {
            color: #8b5cf6;
        }

        .page-header p {
            color: #a1a1aa;
            font-size: 15px;
            line-height: 1.6;
        }


        /* =========================================
           APPLICATIONS TABLE
        ========================================= */

        .applications-table {

            width: 100%;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.25);

            animation:
                tableAppear 0.35s ease both;

        }


        @keyframes tableAppear {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================
           TABLE
        ========================================= */

        table {
            width: 100%;
            border-collapse: collapse;
        }


        /* =========================================
           TABLE HEAD
        ========================================= */

        th {

            padding: 17px 20px;

            text-align: left;

            background: #0d0d0d;

            color: #a1a1aa;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.08);

        }


        /* =========================================
           TABLE CELLS
        ========================================= */

        td {

            padding: 18px 20px;

            text-align: left;

            color: #a1a1aa;

            font-size: 14px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.06);

            transition: 0.2s ease;

        }


        /* =========================================
           LAST ROW
        ========================================= */

        tr:last-child td {
            border-bottom: none;
        }


        /* =========================================
           ROW HOVER
        ========================================= */

        tbody tr {
            transition: 0.2s ease;
        }

        tbody tr:hover {

            background:
                rgba(124, 58, 237, 0.04);

        }


        /* =========================================
           INTERNSHIP TITLE
        ========================================= */

        td strong {

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

        }


        /* =========================================
           STATUS
        ========================================= */

        .status {

            display: inline-flex;

            align-items: center;

            padding: 6px 12px;

            border-radius: 20px;

            background:
                rgba(124, 58, 237, 0.12);

            border:
                1px solid
                rgba(124, 58, 237, 0.18);

            color: #a78bfa;

            font-size: 11px;

            font-weight: 700;

            text-transform: capitalize;

        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            width: 100%;

            padding: 70px 20px;

            text-align: center;

            color: #71717a;

            font-size: 14px;

        }

        .loading i {

            display: block;

            margin-bottom: 12px;

            color: #8b5cf6;

            font-size: 24px;

        }


        /* =========================================
           EMPTY BOX
        ========================================= */

        .empty-box {

            width: 100%;

            margin-top: 20px;

            padding: 65px 20px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            animation:
                tableAppear 0.35s ease both;

        }


        .empty-box > p:first-child {

            margin-bottom: 15px;

            color: #8b5cf6;

            font-size: 38px;

        }


        .empty-box h3 {

            color: #ffffff;

            font-size: 19px;

            margin-bottom: 10px;

        }


        .empty-box p {

            color: #71717a;

            font-size: 14px;

            line-height: 1.6;

        }


        /* =========================================
           FIND INTERNSHIPS BUTTON
        ========================================= */

        .find-btn {

            width: auto;

            min-height: 44px;

            padding: 0 20px;

            margin-top: 22px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            background: #7c3aed;

            color: #ffffff;

            border: none;

            border-radius: 11px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .find-btn:hover {

            background: #6d28d9;

            transform: translateY(-2px);

        }


        /* =========================================
           ERROR / RETRY BUTTON
        ========================================= */

        .retry-btn {

            width: auto;

            min-height: 44px;

            padding: 0 20px;

            margin-top: 15px;

            background: #7c3aed;

            color: #ffffff;

            border: none;

            border-radius: 11px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .retry-btn:hover {

            background: #6d28d9;

            transform: translateY(-2px);

        }


        /* =========================================
           RESPONSIVE NAVBAR
        ========================================= */

        .menu-toggle {

            display: none;

            width: 44px;

            height: 44px;

            padding: 0;

            background: transparent;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 10px;

            cursor: pointer;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 5px;

        }


        .menu-toggle span {

            display: block;

            width: 20px;

            height: 2px;

            background: #ffffff;

            border-radius: 5px;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;

        }


        /* =========================================
           MOBILE NAVBAR
        ========================================= */

        @media (max-width: 800px) {

            .navbar {

                position: sticky;

                top: 0;

                padding: 14px 5%;

                min-height: 70px;

                box-sizing: border-box;

                z-index: 1000;

            }


            .menu-toggle {

                display: flex;

            }


            .nav-links {

                position: absolute;

                top: calc(100% + 1px);

                left: 5%;

                right: 5%;

                width: auto;

                display: flex;

                flex-direction: column;

                align-items: stretch;

                gap: 5px;

                padding: 12px;

                background:
                    rgba(10, 10, 10, 0.98);

                border:
                    1px solid
                    rgba(255, 255, 255, 0.08);

                border-radius: 14px;

                box-shadow:
                    0 20px 50px
                    rgba(0, 0, 0, 0.45);

                opacity: 0;

                visibility: hidden;

                transform:
                    translateY(-10px);

                transition:
                    opacity 0.25s ease,
                    visibility 0.25s ease,
                    transform 0.25s ease;

                z-index: 1000;

            }


            .nav-links.active {

                opacity: 1;

                visibility: visible;

                transform:
                    translateY(0);

            }


            .nav-links a,
            .nav-links button {

                width: 100%;

                box-sizing: border-box;

                padding: 13px 14px;

                text-align: left;

                border-radius: 9px;

                font-size: 14px;

            }


            .nav-links a:hover,
            .nav-links a.active {

                background:
                    rgba(124, 58, 237, 0.12);

            }


            .nav-links button {

                margin-top: 4px;

            }


            /* Hamburger → X */

            .menu-toggle.active span:nth-child(1) {

                transform:
                    translateY(7px)
                    rotate(45deg);

            }


            .menu-toggle.active span:nth-child(2) {

                opacity: 0;

            }


            .menu-toggle.active span:nth-child(3) {

                transform:
                    translateY(-7px)
                    rotate(-45deg);

            }

        }


        /* =========================================
           MOBILE TABLE
        ========================================= */

        @media (max-width: 700px) {

            .applications-table {

                overflow-x: auto;

                border-radius: 16px;

            }


            table {

                min-width: 650px;

            }


            .page-header h1 {

                font-size: 36px;

            }


            .page-header {

                margin-bottom: 25px;

            }

        }


        @media (max-width: 550px) {

            .navbar {

                padding: 13px 4%;

            }


            .nav-links {

                left: 4%;

                right: 4%;

            }


            .page-header h1 {

                font-size: 34px;

            }


            th,
            td {

                padding: 15px 16px;

            }


            .empty-box {

                padding: 50px 18px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            INTERNZO
        </div>


        <div
            class="nav-links"
            id="navLinks"
        >

            <a href="student-dashboard.html">
                Dashboard
            </a>


            <a href="internships.html">
                Internships
            </a>


            <a
                href="my-applications.html"
                class="active"
            >
                My Applications
            </a>


            <a href="student-profile.html">
                My Profile
            </a>


            <button
                class="logout-btn"
                id="logoutBtn"
                type="button"
            >
                Logout
            </button>

        </div>


        <!-- MOBILE MENU -->

        <button
            class="menu-toggle"
            id="menuToggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="false"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </nav>



    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="dashboard-container">


        <!-- PAGE HEADER -->

        <section class="page-header">

            <div class="page-label">
                APPLICATION TRACKER
            </div>


            <h1>
                My <span>Applications</span>
            </h1>


            <p>
                Track all the internships you have applied for.
            </p>

        </section>



        <!-- =========================================
             LOADING
        ========================================= -->

        <div
            id="loading"
            class="loading"
        >

            <i class="fa-solid fa-spinner fa-spin"></i>

            Loading applications...

        </div>



        <!-- =========================================
             APPLICATION TABLE
        ========================================= -->

        <div
            id="applicationsContainer"
            class="applications-table"
            style="display: none;"
        >

            <table>

                <thead>

                    <tr>

                        <th>
                            Internship
                        </th>

                        <th>
                            Company
                        </th>

                        <th>
                            Applied On
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="applicationsBody"
                ></tbody>

            </table>

        </div>



        <!-- =========================================
             EMPTY STATE
        ========================================= -->

        <div
            id="emptyBox"
            class="empty-box"
            style="display: none;"
        >

            <p>
                <i class="fa-solid fa-folder-open"></i>
            </p>


            <h3>
                No Applications Yet
            </h3>


            <p>
                You haven't applied for any internships yet.
            </p>


            <button
                class="find-btn"
                type="button"
                onclick="window.location.href='internships.html'"
            >

                <i class="fa-solid fa-magnifying-glass"></i>

                Find Internships

            </button>

        </div>

    </main>



    <!-- =========================================
         API HELPER
    ========================================= -->

    <script src="js/api.js"></script>



    <script>

        // =========================================
        // MOBILE NAVIGATION
        // =========================================

        const menuToggle =
            document.getElementById(
                "menuToggle"
            );

        const navLinks =
            document.getElementById(
                "navLinks"
            );


        if (
            menuToggle &&
            navLinks
        ) {

            // Toggle menu

            menuToggle.addEventListener(
                "click",
                function () {

                    menuToggle.classList.toggle(
                        "active"
                    );

                    navLinks.classList.toggle(
                        "active"
                    );


                    const isOpen =
                        navLinks.classList.contains(
                            "active"
                        );


                    menuToggle.setAttribute(
                        "aria-expanded",
                        isOpen
                    );

                }
            );


            // Close after clicking links

            document
                .querySelectorAll(
                    ".nav-links a"
                )
                .forEach(
                    function (link) {

                        link.addEventListener(
                            "click",
                            function () {

                                menuToggle.classList.remove(
                                    "active"
                                );

                                navLinks.classList.remove(
                                    "active"
                                );

                                menuToggle.setAttribute(
                                    "aria-expanded",
                                    "false"
                                );

                            }
                        );

                    }
                );


            // Close when clicking outside

            document.addEventListener(
                "click",
                function (event) {

                    if (
                        !navLinks.contains(
                            event.target
                        ) &&
                        !menuToggle.contains(
                            event.target
                        )
                    ) {

                        menuToggle.classList.remove(
                            "active"
                        );

                        navLinks.classList.remove(
                            "active"
                        );

                        menuToggle.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }

                }
            );


            // Close with Escape

            document.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Escape"
                    ) {

                        menuToggle.classList.remove(
                            "active"
                        );

                        navLinks.classList.remove(
                            "active"
                        );

                        menuToggle.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }

                }
            );

        }



        // =========================================
        // LOAD APPLICATIONS
        // =========================================

        async function loadApplications() {

            const token =
                localStorage.getItem(
                    "token"
                );


            // =====================================
            // LOGIN CHECK
            // =====================================

            if (!token) {

                window.location.href =
                    "login.html";

                return;

            }


            const loading =
                document.getElementById(
                    "loading"
                );


            const container =
                document.getElementById(
                    "applicationsContainer"
                );


            const emptyBox =
                document.getElementById(
                    "emptyBox"
                );


            const body =
                document.getElementById(
                    "applicationsBody"
                );


            // Reset states

            loading.style.display =
                "block";

            container.style.display =
                "none";

            emptyBox.style.display =
                "none";


            try {

                // =================================
                // API REQUEST
                // =================================

                const data =
                    await apiFetch(
                        "/api/applications/my-applications"
                    );


                // =================================
                // HIDE LOADING
                // =================================

                loading.style.display =
                    "none";


                // =================================
                // NO APPLICATIONS
                // =================================

                if (
                    !Array.isArray(data) ||
                    data.length === 0
                ) {

                    emptyBox.style.display =
                        "block";

                    return;

                }


                // =================================
                // SHOW TABLE
                // =================================

                container.style.display =
                    "block";

                body.innerHTML =
                    "";


                // =================================
                // RENDER APPLICATIONS
                // =================================

                data.forEach(
                    function(application) {

                        const row =
                            document.createElement(
                                "tr"
                            );


                        // =============================
                        // DATE
                        // =============================

                        let date =
                            "—";


                        if (
                            application.createdAt
                        ) {

                            const parsedDate =
                                new Date(
                                    application.createdAt
                                );


                            if (
                                !isNaN(
                                    parsedDate.getTime()
                                )
                            ) {

                                date =
                                    parsedDate
                                        .toLocaleDateString(
                                            "en-IN",
                                            {
                                                day: "2-digit",
                                                month: "short",
                                                year: "numeric"
                                            }
                                        );

                            }

                        }


                        // =============================
                        // INTERNSHIP
                        // =============================

                        const internshipTitle =
                            application
                                .internship
                                ?.title ||
                            "Internship";


                        // =============================
                        // COMPANY
                        // =============================

                        const companyName =
                            application
                                .internship
                                ?.companyName ||
                            application
                                .company
                                ?.name ||
                            "Company";


                        // =============================
                        // STATUS
                        // =============================

                        const status =
                            application.status ||
                            "Pending";


                        // =============================
                        // CREATE ROW
                        // =============================

                        row.innerHTML = `

                            <td>

                                <strong>
                                    ${escapeHTML(
                                        internshipTitle
                                    )}
                                </strong>

                            </td>


                            <td>
                                ${escapeHTML(
                                    companyName
                                )}
                            </td>


                            <td>
                                ${date}
                            </td>


                            <td>

                                <span class="status">

                                    ${escapeHTML(
                                        status
                                    )}

                                </span>

                            </td>

                        `;


                        body.appendChild(
                            row
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Applications loading error:",
                    error
                );


                loading.innerHTML = `

                    <i class="fa-solid fa-server"></i>

                    <p>
                        Unable to connect to the INTERNZO server.
                    </p>

                    <button
                        class="retry-btn"
                        type="button"
                        onclick="loadApplications()"
                    >

                        Try Again

                    </button>

                `;


                loading.style.display =
                    "block";

            }

        }



        // =========================================
        // ESCAPE HTML
        // =========================================

        function escapeHTML(value) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value;

            return div.innerHTML;

        }



        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "login.html";

        }


        // =========================================
        // LOGOUT BUTTON
        // =========================================

        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        if (logoutBtn) {

            logoutBtn.addEventListener(
                "click",
                logout
            );

        }



        // =========================================
        // START
        // =========================================

        loadApplications();

    </script>

</body>

</html>
