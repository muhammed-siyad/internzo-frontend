<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>INTERNZO - My Applications</title>

    <link rel="stylesheet"
        href="css/dashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {
            margin-bottom: 30px;
        }

        .page-label {
            color: #8b5cf6;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        .page-header h1 {
            color: #ffffff;

            font-size: clamp(36px, 5vw, 48px);

            line-height: 1.05;

            letter-spacing: -1.5px;

            margin-bottom: 12px;
        }

        .page-header h1 span {
            color: #8b5cf6;
        }

        .page-header p {
            color: #a1a1aa;

            font-size: 15px;

            line-height: 1.6;
        }


        /* =========================================
           APPLICATIONS TABLE
        ========================================= */

        .applications-table {

            width: 100%;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.25);

            animation:
                tableAppear 0.35s ease both;

        }


        @keyframes tableAppear {

            from {
                opacity: 0;

                transform:
                    translateY(10px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =========================================
           TABLE
        ========================================= */

        table {

            width: 100%;

            border-collapse: collapse;

        }


        /* =========================================
           TABLE HEAD
        ========================================= */

        th {

            padding:
                17px 20px;

            text-align: left;

            background: #0d0d0d;

            color: #a1a1aa;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.08);

        }


        /* =========================================
           TABLE CELLS
        ========================================= */

        td {

            padding:
                18px 20px;

            text-align: left;

            color: #a1a1aa;

            font-size: 14px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.06);

            transition: 0.2s ease;

        }


        /* =========================================
           LAST ROW
        ========================================= */

        tr:last-child td {
            border-bottom: none;
        }


        /* =========================================
           ROW HOVER
        ========================================= */

        tbody tr {
            transition: 0.2s ease;
        }

        tbody tr:hover {

            background:
                rgba(124, 58, 237, 0.04);

        }


        /* =========================================
           INTERNSHIP TITLE
        ========================================= */

        td strong {

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

        }


        /* =========================================
           STATUS
        ========================================= */

        .status {

            display: inline-flex;

            align-items: center;

            padding:
                6px 12px;

            border-radius: 20px;

            background:
                rgba(124, 58, 237, 0.12);

            border:
                1px solid
                rgba(124, 58, 237, 0.18);

            color: #a78bfa;

            font-size: 11px;

            font-weight: 700;

            text-transform: capitalize;

        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            width: 100%;

            padding: 70px 20px;

            text-align: center;

            color: #71717a;

            font-size: 14px;

        }

        .loading i {

            display: block;

            margin-bottom: 12px;

            color: #8b5cf6;

            font-size: 24px;

        }


        /* =========================================
           EMPTY BOX
        ========================================= */

        .empty-box {

            width: 100%;

            margin-top: 20px;

            padding: 65px 20px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            animation:
                tableAppear 0.35s ease both;

        }


        .empty-box > p:first-child {

            margin-bottom: 15px;

            color: #8b5cf6;

            font-size: 38px;

        }


        .empty-box h3 {

            color: #ffffff;

            font-size: 19px;

            margin-bottom: 10px;

        }


        .empty-box p {

            color: #71717a;

            font-size: 14px;

            line-height: 1.6;

        }


        /* =========================================
           FIND INTERNSHIPS BUTTON
        ========================================= */

        .find-btn {

            width: auto;

            min-height: 44px;

            padding:
                0 20px;

            margin-top: 22px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            background: #7c3aed;

            color: #ffffff;

            border: none;

            border-radius: 11px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .find-btn:hover {

            background: #6d28d9;

            transform:
                translateY(-2px);

        }


        /* =========================================
           ERROR / RETRY BUTTON
        ========================================= */

        .retry-btn {

            width: auto;

            min-height: 44px;

            padding:
                0 20px;

            margin-top: 15px;

            background: #7c3aed;

            color: #ffffff;

            border: none;

            border-radius: 11px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .retry-btn:hover {

            background: #6d28d9;

            transform:
                translateY(-2px);

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .applications-table {

                overflow-x: auto;

                border-radius: 16px;

            }

            table {

                min-width: 650px;

            }

            .page-header h1 {

                font-size: 36px;

            }

            .page-header {

                margin-bottom: 25px;

            }

        }


        @media (max-width: 550px) {

            .page-header h1 {

                font-size: 34px;

            }

            th,
            td {

                padding:
                    15px 16px;

            }

            .empty-box {

                padding:
                    50px 18px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            INTERNZO
        </div>


        <div class="nav-links">

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="internships.html">
                Internships
            </a>

            <a
                href="my-applications.html"
                class="active">

                My Applications

            </a>

            <a href="student-profile.html">
                My Profile
            </a>

            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="dashboard-container">


        <!-- PAGE HEADER -->

        <section class="page-header">

            <div class="page-label">
                APPLICATION TRACKER
            </div>

            <h1>
                My <span>Applications</span>
            </h1>

            <p>
                Track all the internships you have applied for.
            </p>

        </section>


        <!-- =========================================
             LOADING
        ========================================= -->

        <div
            id="loading"
            class="loading">

            <i class="fa-solid fa-spinner fa-spin"></i>

            Loading applications...

        </div>


        <!-- =========================================
             APPLICATION TABLE
        ========================================= -->

        <div
            id="applicationsContainer"
            class="applications-table"
            style="display: none;">

            <table>

                <thead>

                    <tr>

                        <th>
                            Internship
                        </th>

                        <th>
                            Company
                        </th>

                        <th>
                            Applied On
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="applicationsBody">
                </tbody>

            </table>

        </div>


        <!-- =========================================
             EMPTY STATE
        ========================================= -->

        <div
            id="emptyBox"
            class="empty-box"
            style="display: none;">

            <p>
                <i class="fa-solid fa-folder-open"></i>
            </p>

            <h3>
                No Applications Yet
            </h3>

            <p>
                You haven't applied for any internships yet.
            </p>


            <button
                class="find-btn"
                onclick="window.location.href='internships.html'">

                <i class="fa-solid fa-magnifying-glass"></i>

                Find Internships

            </button>

        </div>

    </main>


    <!-- =========================================
         API HELPER
    ========================================= -->

    <script src="js/api.js"></script>


    <script>

        // =========================================
        // LOAD APPLICATIONS
        // =========================================

        async function loadApplications() {

            const token =
                localStorage.getItem(
                    "token"
                );


            // =====================================
            // LOGIN CHECK
            // =====================================

            if (!token) {

                window.location.href =
                    "login.html";

                return;

            }


            const loading =
                document.getElementById(
                    "loading"
                );


            const container =
                document.getElementById(
                    "applicationsContainer"
                );


            const emptyBox =
                document.getElementById(
                    "emptyBox"
                );


            const body =
                document.getElementById(
                    "applicationsBody"
                );


            // Reset states

            loading.style.display =
                "block";

            container.style.display =
                "none";

            emptyBox.style.display =
                "none";


            try {

                // =================================
                // API REQUEST
                // =================================

                const data =
                    await apiFetch(
                        "/api/applications/my-applications"
                    );


                // =================================
                // HIDE LOADING
                // =================================

                loading.style.display =
                    "none";


                // =================================
                // NO APPLICATIONS
                // =================================

                if (
                    !Array.isArray(data) ||
                    data.length === 0
                ) {

                    emptyBox.style.display =
                        "block";

                    return;

                }


                // =================================
                // SHOW TABLE
                // =================================

                container.style.display =
                    "block";


                body.innerHTML = "";


                // =================================
                // RENDER APPLICATIONS
                // =================================

                data.forEach(
                    function(application) {

                        const row =
                            document.createElement(
                                "tr"
                            );


                        // =============================
                        // DATE
                        // =============================

                        let date =
                            "—";


                        if (
                            application.createdAt
                        ) {

                            const parsedDate =
                                new Date(
                                    application.createdAt
                                );


                            if (
                                !isNaN(
                                    parsedDate.getTime()
                                )
                            ) {

                                date =
                                    parsedDate
                                        .toLocaleDateString(
                                            "en-IN",
                                            {
                                                day: "2-digit",
                                                month: "short",
                                                year: "numeric"
                                            }
                                        );

                            }

                        }


                        // =============================
                        // INTERNSHIP
                        // =============================

                        const internshipTitle =
                            application
                                .internship
                                ?.title ||
                            "Internship";


                        // =============================
                        // COMPANY
                        // =============================

                        const companyName =
                            application
                                .internship
                                ?.companyName ||
                            application
                                .company
                                ?.name ||
                            "Company";


                        // =============================
                        // STATUS
                        // =============================

                        const status =
                            application.status ||
                            "Pending";


                        // =============================
                        // CREATE ROW
                        // =============================

                        row.innerHTML = `

                            <td>

                                <strong>
                                    ${escapeHTML(
                                        internshipTitle
                                    )}
                                </strong>

                            </td>


                            <td>
                                ${escapeHTML(
                                    companyName
                                )}
                            </td>


                            <td>
                                ${date}
                            </td>


                            <td>

                                <span class="status">

                                    ${escapeHTML(
                                        status
                                    )}

                                </span>

                            </td>

                        `;


                        body.appendChild(
                            row
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Applications loading error:",
                    error
                );


                loading.innerHTML = `

                    <i class="fa-solid fa-server"></i>

                    <p>
                        Unable to connect to the INTERNZO server.
                    </p>

                    <button
                        class="retry-btn"
                        onclick="loadApplications()">

                        Try Again

                    </button>

                `;


                loading.style.display =
                    "block";

            }

        }


        // =========================================
        // ESCAPE HTML
        // =========================================

        function escapeHTML(value) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value;

            return div.innerHTML;

        }


        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "login.html";

        }


        // =========================================
        // START
        // =========================================

        loadApplications();

    </script>

</body>

</html>
