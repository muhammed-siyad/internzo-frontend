<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>INTERNZO - My Profile</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #050505;

            color: #ffffff;

            overflow-x: hidden;
        }


        /* =========================================
           NAVBAR
        ========================================= */

        .navbar {
            width: 100%;

            padding: 18px 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: sticky;

            top: 0;

            z-index: 1000;

            background:
                rgba(5, 5, 5, 0.88);

            backdrop-filter: blur(14px);

            -webkit-backdrop-filter: blur(14px);

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.07);
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {
            color: #ffffff;

            font-size: 24px;

            font-weight: 800;

            letter-spacing: -0.5px;

            white-space: nowrap;
        }


        /* =========================================
           NAV LINKS
        ========================================= */

        .nav-links {
            display: flex;

            align-items: center;

            gap: 25px;
        }

        .nav-links a {
            color: #a1a1aa;

            text-decoration: none;

            font-size: 14px;

            font-weight: 500;

            white-space: nowrap;

            transition: 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffffff;
        }


        /* =========================================
           LOGOUT
        ========================================= */

        .logout-btn {
            width: auto;

            padding: 9px 0;

            border: none;

            background: transparent;

            color: #a1a1aa;

            font-size: 14px;

            font-weight: 500;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .logout-btn:hover {
            color: #ff5c5c;
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .profile-container {
            width: min(1100px, 92%);

            margin: 0 auto;

            padding: 70px 0 100px;
        }


        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {
            margin-bottom: 35px;
        }

        .page-label {
            margin-bottom: 12px;

            color: #8b5cf6;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 2px;
        }

        .page-header h1 {
            font-size: clamp(36px, 5vw, 56px);

            line-height: 1.05;

            letter-spacing: -2px;

            margin-bottom: 16px;
        }

        .page-header h1 span {
            color: #8b5cf6;
        }

        .page-header p {
            max-width: 650px;

            color: #a1a1aa;

            font-size: 15px;

            line-height: 1.7;
        }


        /* =========================================
           PROFILE HEADER
        ========================================= */

        .profile-header {
            display: flex;

            align-items: center;

            gap: 20px;

            padding: 25px;

            margin-bottom: 20px;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            transition: 0.25s ease;

            animation:
                cardAppear 0.35s ease both;
        }

        .profile-header:hover {
            border-color:
                rgba(124, 58, 237, 0.35);

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.25);
        }


        /* =========================================
           PROFILE ICON
        ========================================= */

        .profile-icon {
            width: 70px;

            height: 70px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(124, 58, 237, 0.12);

            border:
                1px solid
                rgba(124, 58, 237, 0.2);

            color: #8b5cf6;

            font-size: 28px;
        }


        /* =========================================
           PROFILE INFO
        ========================================= */

        .profile-info h2 {
            color: #ffffff;

            font-size: 22px;

            margin-bottom: 6px;
        }

        .profile-info p {
            color: #71717a;

            font-size: 14px;
        }


        /* =========================================
           PROFILE CARD
        ========================================= */

        .profile-card {
            padding: 30px;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            animation:
                cardAppear 0.4s ease both;
        }

        .profile-card h2 {
            display: flex;

            align-items: center;

            gap: 10px;

            color: #ffffff;

            font-size: 21px;

            margin-bottom: 25px;
        }

        .profile-card h2 i {
            color: #8b5cf6;

            font-size: 18px;
        }


        /* =========================================
           FORM GRID
        ========================================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 22px;
        }

        .form-group {
            display: flex;

            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }


        /* =========================================
           LABELS
        ========================================= */

        .form-group label {
            color: #d4d4d8;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        /* =========================================
           INPUTS
        ========================================= */

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;

            padding: 13px 14px;

            background: #101010;

            color: #ffffff;

            border:
                1px solid
                rgba(255, 255, 255, 0.09);

            border-radius: 10px;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            transition: 0.2s ease;
        }


        /* PLACEHOLDER */

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #71717a;
        }


        /* SELECT */

        .form-group select {
            cursor: pointer;
        }

        .form-group select option {
            background: #101010;

            color: #ffffff;
        }


        /* FOCUS */

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px
                rgba(124, 58, 237, 0.12);
        }


        /* TEXTAREA */

        .form-group textarea {
            min-height: 120px;

            resize: vertical;

            line-height: 1.6;
        }


        /* =========================================
           SKILLS INPUT
        ========================================= */

        .skill-input {
            display: flex;

            gap: 10px;
        }

        .skill-input input {
            flex: 1;
        }


        /* =========================================
           ADD SKILL BUTTON
        ========================================= */

        .add-skill-btn {
            width: auto;

            min-width: 90px;

            padding: 0 18px;

            border: none;

            border-radius: 10px;

            background: #7c3aed;

            color: #ffffff;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .add-skill-btn:hover {
            background: #6d28d9;

            transform:
                translateY(-2px);
        }


        /* =========================================
           SKILLS
        ========================================= */

        .skills-container {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 12px;
        }


        /* =========================================
           SKILL TAG
        ========================================= */

        .skill-tag {
            display: flex;

            align-items: center;

            gap: 7px;

            padding: 7px 11px;

            border:
                1px solid
                rgba(124, 58, 237, 0.2);

            border-radius: 20px;

            background:
                rgba(124, 58, 237, 0.12);

            color: #a78bfa;

            font-size: 13px;

            font-weight: 600;
        }

        .skill-tag button {
            width: auto;

            min-height: auto;

            padding: 0;

            border: none;

            background: transparent;

            color: #8b5cf6;

            cursor: pointer;

            font-size: 12px;

            transition: 0.2s ease;
        }

        .skill-tag button:hover {
            color: #f87171;

            transform: none;
        }


        /* =========================================
           SAVE SECTION
        ========================================= */

        .save-section {
            display: flex;

            align-items: center;

            gap: 15px;

            margin-top: 30px;
        }


        /* =========================================
           SAVE BUTTON
        ========================================= */

        .save-btn {
            width: auto;

            min-height: 46px;

            padding: 0 24px;

            border: none;

            border-radius: 11px;

            background: #7c3aed;

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .save-btn:hover {
            background: #6d28d9;

            transform:
                translateY(-2px);
        }

        .save-btn:disabled {
            opacity: 0.65;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        #message {
            min-height: 20px;

            color: #a1a1aa;

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================================
           AUTOFILL
        ========================================= */

        .form-group input:-webkit-autofill,
        .form-group input:-webkit-autofill:hover,
        .form-group input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff;

            -webkit-box-shadow:
                0 0 0 1000px #101010 inset;

            transition:
                background-color 5000s ease-in-out 0s;
        }


        /* =========================================
           ANIMATION
        ========================================= */

        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(10px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 850px) {

            .navbar {
                padding: 16px 5%;
            }

            .nav-links {
                gap: 14px;
            }

            .nav-links a,
            .nav-links button {
                font-size: 12px;
            }

            .logo {
                font-size: 20px;
            }

            .profile-container {
                width: 90%;

                padding-top: 50px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 550px) {

            .navbar {
                align-items: flex-start;

                flex-direction: column;

                gap: 15px;
            }

            .nav-links {
                width: 100%;

                justify-content:
                    space-between;

                gap: 8px;
            }

            .profile-container {
                padding-top: 40px;
            }

            .page-header {
                margin-bottom: 30px;
            }

            .page-header h1 {
                font-size: 38px;
            }

            .profile-header {
                align-items: flex-start;

                padding: 20px;

                gap: 15px;
            }

            .profile-icon {
                width: 58px;

                height: 58px;

                font-size: 23px;
            }

            .profile-info h2 {
                font-size: 19px;
            }

            .profile-card {
                padding: 20px;
            }

            .skill-input {
                flex-direction: column;
            }

            .add-skill-btn {
                width: 100%;

                min-height: 44px;
            }

            .save-section {
                align-items: stretch;

                flex-direction: column;
            }

            .save-btn {
                width: 100%;
            }

        }


        /* =========================================
           VERY SMALL MOBILE
        ========================================= */

        @media (max-width: 380px) {

            .navbar {
                padding: 15px 4%;
            }

            .logo {
                font-size: 20px;
            }

            .nav-links {
                gap: 7px;
            }

            .nav-links a,
            .nav-links button {
                font-size: 11px;
            }

            .profile-container {
                width: 92%;

                padding-top: 30px;
            }

            .page-header h1 {
                font-size: 32px;
            }

            .profile-card {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            INTERNZO
        </div>


        <div class="nav-links">

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="internships.html">
                Internships
            </a>

            <a href="my-applications.html">
                My Applications
            </a>

            <a href="student-profile.html"
                class="active">
                My Profile
            </a>

            <button
                class="logout-btn"
                onclick="logout()">

                <i class="fa-solid fa-right-from-bracket"></i>
                Logout

            </button>

        </div>

    </nav>


    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="profile-container">


        <!-- PAGE HEADER -->

        <div class="page-header">

            <div class="page-label">
                STUDENT PROFILE
            </div>

            <h1>
                My <span>Profile</span>
            </h1>

            <p>
                Manage your personal and academic information.
            </p>

        </div>


        <!-- =========================================
             PROFILE HEADER
        ========================================= -->

        <div class="profile-header">

            <div class="profile-icon">

                <i class="fa-solid fa-user"></i>

            </div>


            <div class="profile-info">

                <h2 id="profileName">
                    Student
                </h2>

                <p id="profileEmail">
                    Loading...
                </p>

            </div>

        </div>


        <!-- =========================================
             PROFILE FORM
        ========================================= -->

        <div class="profile-card">

            <h2>

                <i class="fa-solid fa-user-pen"></i>

                Personal & Academic Information

            </h2>


            <div class="form-grid">


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <!-- COLLEGE -->

                <div class="form-group">

                    <label for="college">
                        College
                    </label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter your college name"
                    >

                </div>


                <!-- COURSE -->

                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <input
                        type="text"
                        id="course"
                        placeholder="Example: BCA"
                    >

                </div>


                <!-- EDUCATION -->

                <div class="form-group">

                    <label for="education">
                        Education
                    </label>

                    <select id="education">

                        <option value="">
                            Select your year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>


                <!-- SKILLS -->

                <div class="form-group full-width">

                    <label>
                        Skills
                    </label>


                    <div class="skill-input">

                        <input
                            type="text"
                            id="skillInput"
                            placeholder="Example: JavaScript"
                        >


                        <button
                            type="button"
                            class="add-skill-btn"
                            onclick="addSkill()">

                            <i class="fa-solid fa-plus"></i>
                            Add

                        </button>

                    </div>


                    <div
                        class="skills-container"
                        id="skillsContainer">
                    </div>

                </div>


                <!-- BIO -->

                <div class="form-group full-width">

                    <label for="bio">
                        About You
                    </label>

                    <textarea
                        id="bio"
                        placeholder="Write a short description about yourself..."
                    ></textarea>

                </div>


                <!-- RESUME -->

                <div class="form-group full-width">

                    <label for="resume">
                        Resume Link
                    </label>

                    <input
                        type="url"
                        id="resume"
                        placeholder="Paste your resume link"
                    >

                </div>

            </div>


            <!-- SAVE -->

            <div class="save-section">

                <button
                    type="button"
                    class="save-btn"
                    id="saveButton"
                    onclick="saveProfile()">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Profile

                </button>


                <span id="message"></span>

            </div>

        </div>

    </main>


    <!-- =========================================
         API HELPER
    ========================================= -->

    <script src="js/api.js"></script>


    <script>

        // =========================================
        // USER DATA
        // =========================================

        let skills = [];

        const token =
            localStorage.getItem("token");

        const userData =
            localStorage.getItem("user");


        // =========================================
        // LOGIN CHECK
        // =========================================

        if (!token || !userData) {

            window.location.href =
                "login.html";

        }


        // =========================================
        // GET USER
        // =========================================

        let user = null;


        try {

            user =
                JSON.parse(userData);

        } catch (error) {

            console.error(
                "User data error:",
                error
            );

            localStorage.removeItem("token");

            localStorage.removeItem("user");

            window.location.href =
                "login.html";

        }


        // =========================================
        // CHECK STUDENT ROLE
        // =========================================

        if (
            user &&
            user.role &&
            user.role !== "student"
        ) {

            if (user.role === "company") {

                window.location.href =
                    "company-dashboard.html";

            } else if (
                user.role === "admin"
            ) {

                window.location.href =
                    "admin-dashboard.html";

            }

        }


        // =========================================
        // DISPLAY USER
        // =========================================

        if (user) {

            document.getElementById(
                "profileName"
            ).textContent =
                user.name || "Student";


            document.getElementById(
                "profileEmail"
            ).textContent =
                user.email || "";

        }


        // =========================================
        // LOAD PROFILE
        // =========================================

        async function loadProfile() {

            try {

                const data =
                    await apiFetch(
                        "/api/profile"
                    );


                document.getElementById(
                    "phone"
                ).value =
                    data.phone || "";


                document.getElementById(
                    "college"
                ).value =
                    data.college || "";


                document.getElementById(
                    "course"
                ).value =
                    data.course || "";


                document.getElementById(
                    "education"
                ).value =
                    data.education || "";


                document.getElementById(
                    "bio"
                ).value =
                    data.bio || "";


                document.getElementById(
                    "resume"
                ).value =
                    data.resume || "";


                skills =
                    Array.isArray(data.skills)
                        ? data.skills
                        : [];


                displaySkills();

            } catch (error) {

                console.error(
                    "Profile loading error:",
                    error
                );

                if (
                    error.message &&
                    (
                        error.message
                            .toLowerCase()
                            .includes("token") ||
                        error.message
                            .toLowerCase()
                            .includes("unauthorized")
                    )
                ) {

                    localStorage.removeItem(
                        "token"
                    );

                    localStorage.removeItem(
                        "user"
                    );

                    window.location.href =
                        "login.html";

                }

            }

        }


        // =========================================
        // DISPLAY SKILLS
        // =========================================

        function displaySkills() {

            const container =
                document.getElementById(
                    "skillsContainer"
                );


            container.innerHTML = "";


            skills.forEach(
                function(skill, index) {

                    const tag =
                        document.createElement(
                            "div"
                        );


                    tag.className =
                        "skill-tag";


                    tag.innerHTML = `

                        <span>
                            ${escapeHTML(skill)}
                        </span>

                        <button
                            type="button"
                            onclick="removeSkill(${index})"
                            aria-label="Remove ${escapeHTML(skill)}">

                            <i class="fa-solid fa-xmark"></i>

                        </button>

                    `;


                    container.appendChild(tag);

                }
            );

        }


        // =========================================
        // ESCAPE HTML
        // =========================================

        function escapeHTML(value) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value;

            return div.innerHTML;

        }


        // =========================================
        // ADD SKILL
        // =========================================

        function addSkill() {

            const input =
                document.getElementById(
                    "skillInput"
                );


            const skill =
                input.value.trim();


            if (!skill) {

                return;

            }


            const exists =
                skills.some(
                    item =>
                        item.toLowerCase() ===
                        skill.toLowerCase()
                );


            if (exists) {

                input.value = "";

                return;

            }


            skills.push(skill);

            input.value = "";

            displaySkills();

        }


        // =========================================
        // ENTER KEY
        // =========================================

        document
            .getElementById("skillInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        addSkill();

                    }

                }
            );


        // =========================================
        // REMOVE SKILL
        // =========================================

        function removeSkill(index) {

            skills.splice(
                index,
                1
            );

            displaySkills();

        }


        // =========================================
        // SAVE PROFILE
        // =========================================

        async function saveProfile() {

            const message =
                document.getElementById(
                    "message"
                );

            const saveButton =
                document.getElementById(
                    "saveButton"
                );


            const profileData = {

                phone:
                    document.getElementById(
                        "phone"
                    ).value.trim(),

                college:
                    document.getElementById(
                        "college"
                    ).value.trim(),

                course:
                    document.getElementById(
                        "course"
                    ).value.trim(),

                education:
                    document.getElementById(
                        "education"
                    ).value,

                skills:
                    skills,

                bio:
                    document.getElementById(
                        "bio"
                    ).value.trim(),

                resume:
                    document.getElementById(
                        "resume"
                    ).value.trim()

            };


            try {

                saveButton.disabled = true;

                saveButton.innerHTML = `
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    Saving...
                `;

                message.textContent = "";


                await apiFetch(
                    "/api/profile",
                    {
                        method: "POST",

                        body:
                            JSON.stringify(
                                profileData
                            )
                    }
                );


                message.style.color =
                    "#4ade80";

                message.textContent =
                    "Profile saved successfully!";


            } catch (error) {

                console.error(
                    "Profile save error:",
                    error
                );


                message.style.color =
                    "#f87171";

                message.textContent =
                    error.message ||
                    "Unable to save profile.";

            } finally {

                saveButton.disabled =
                    false;

                saveButton.innerHTML = `
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Profile
                `;

            }

        }


        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "login.html";

        }


        // =========================================
        // LOAD PROFILE
        // =========================================

        if (token && user) {

            loadProfile();

        }

    </script>

</body>

</html>
