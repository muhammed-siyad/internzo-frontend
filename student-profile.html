<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>INTERNZO - My Profile</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f8fafc;
            color: #111827;
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar {
            width: 100%;
            min-height: 72px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: #7c3aed;
            font-size: 25px;
            font-weight: 800;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: #475569;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #7c3aed;
        }

        .logout-btn {
            width: auto;
            padding: 9px 18px;
            background: white;
            color: #7c3aed;
            border: 1px solid #ddd6fe;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #f3e8ff;
        }

        /* MAIN */

        .profile-container {
            max-width: 1100px;
            margin: auto;
            padding: 45px 30px 60px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-header h1 span {
            color: #7c3aed;
        }

        .page-header p {
            color: #64748b;
            font-size: 15px;
        }

        /* PROFILE HEADER */

        .profile-header {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .profile-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #f3e8ff;
            color: #7c3aed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .profile-info h2 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .profile-info p {
            color: #64748b;
            font-size: 14px;
        }

        /* FORM */

        .profile-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 30px;
        }

        .profile-card h2 {
            font-size: 21px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: white;
            color: #111827;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px #f3e8ff;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* SKILLS */

        .skill-input {
            display: flex;
            gap: 10px;
        }

        .skill-input input {
            flex: 1;
        }

        .add-skill-btn {
            width: auto;
            padding: 0 18px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .add-skill-btn:hover {
            background: #6d28d9;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .skill-tag {
            display: flex;
            align-items: center;
            gap: 7px;
            background: #f3e8ff;
            color: #6d28d9;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .skill-tag button {
            border: none;
            background: none;
            color: #7c3aed;
            cursor: pointer;
        }

        /* SAVE */

        .save-section {
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .save-btn {
            width: auto;
            padding: 13px 25px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 9px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #6d28d9;
        }

        #message {
            font-size: 14px;
            font-weight: 600;
        }

        /* RESPONSIVE */

        @media (max-width: 850px) {

            .navbar {
                padding: 18px 25px;
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }

        @media (max-width: 600px) {

            .profile-container {
                padding: 30px 18px;
            }

            .profile-card {
                padding: 22px;
            }

            .page-header h1 {
                font-size: 27px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                font-size: 12px;
            }
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            INTERNZO
        </div>

        <div class="nav-links">

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="internships.html">
                Internships
            </a>

            <a href="my-applications.html">
                My Applications
            </a>

            <a href="student-profile.html"
                class="active">
                My Profile
            </a>

            <button
                class="logout-btn"
                onclick="logout()">

                <i class="fa-solid fa-right-from-bracket"></i>
                Logout

            </button>

        </div>

    </nav>



    <!-- MAIN -->

    <main class="profile-container">


        <div class="page-header">

            <h1>
                My <span>Profile</span>
            </h1>

            <p>
                Manage your personal and academic information.
            </p>

        </div>



        <!-- PROFILE INFORMATION -->

        <div class="profile-header">

            <div class="profile-icon">

                <i class="fa-solid fa-user"></i>

            </div>

            <div class="profile-info">

                <h2 id="profileName">
                    Student
                </h2>

                <p id="profileEmail">
                    Loading...
                </p>

            </div>

        </div>



        <!-- PROFILE FORM -->

        <div class="profile-card">

            <h2>

                <i class="fa-solid fa-user-pen"></i>

                Personal & Academic Information

            </h2>


            <div class="form-grid">


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                    >

                </div>



                <!-- COLLEGE -->

                <div class="form-group">

                    <label for="college">
                        College
                    </label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter your college name"
                    >

                </div>



                <!-- COURSE -->

                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <input
                        type="text"
                        id="course"
                        placeholder="Example: BCA"
                    >

                </div>



                <!-- EDUCATION -->

                <div class="form-group">

                    <label for="education">
                        Education
                    </label>

                    <select id="education">

                        <option value="">
                            Select your year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>



                <!-- SKILLS -->

                <div class="form-group full-width">

                    <label>
                        Skills
                    </label>

                    <div class="skill-input">

                        <input
                            type="text"
                            id="skillInput"
                            placeholder="Example: JavaScript"
                        >

                        <button
                            type="button"
                            class="add-skill-btn"
                            onclick="addSkill()">

                            <i class="fa-solid fa-plus"></i>
                            Add

                        </button>

                    </div>

                    <div
                        class="skills-container"
                        id="skillsContainer">
                    </div>

                </div>



                <!-- BIO -->

                <div class="form-group full-width">

                    <label for="bio">
                        About You
                    </label>

                    <textarea
                        id="bio"
                        placeholder="Write a short description about yourself..."
                    ></textarea>

                </div>



                <!-- RESUME -->

                <div class="form-group full-width">

                    <label for="resume">
                        Resume Link
                    </label>

                    <input
                        type="url"
                        id="resume"
                        placeholder="Paste your resume link"
                    >

                </div>

            </div>



            <!-- SAVE BUTTON -->

            <div class="save-section">

                <button
                    type="button"
                    class="save-btn"
                    onclick="saveProfile()">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Profile

                </button>

                <span id="message"></span>

            </div>

        </div>

    </main>



    <script>

        // =========================================
        // RENDER BACKEND API
        // =========================================

        const API_URL =
            "https://internzo-backend.onrender.com";


        let skills = [];


        // =========================================
        // CHECK LOGIN
        // =========================================

        const token =
            localStorage.getItem("token");

        const userData =
            localStorage.getItem("user");


        if (!token || !userData) {

            window.location.href =
                "login.html";

        }


        // =========================================
        // GET USER
        // =========================================

        let user;


        try {

            user =
                JSON.parse(userData);

        } catch (error) {

            console.error(
                "User data error:",
                error
            );

            localStorage.removeItem("token");
            localStorage.removeItem("user");

            window.location.href =
                "login.html";

        }


        // =========================================
        // CHECK STUDENT ROLE
        // =========================================

        if (
            user &&
            user.role &&
            user.role !== "student"
        ) {

            if (user.role === "company") {

                window.location.href =
                    "company-dashboard.html";

            } else if (
                user.role === "admin"
            ) {

                window.location.href =
                    "admin-dashboard.html";

            }

        }


        // =========================================
        // DISPLAY USER
        // =========================================

        if (user) {

            document.getElementById(
                "profileName"
            ).textContent =
                user.name || "Student";

            document.getElementById(
                "profileEmail"
            ).textContent =
                user.email || "";

        }


        // =========================================
        // LOAD PROFILE
        // =========================================

        async function loadProfile() {

            try {

                const response =
                    await fetch(
                        `${API_URL}/api/profile`,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                if (response.status === 401) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    window.location.href =
                        "login.html";

                    return;

                }


                const data =
                    await response.json();


                if (!response.ok) {

                    console.error(
                        "Profile loading failed:",
                        data.message
                    );

                    return;

                }


                document.getElementById(
                    "phone"
                ).value =
                    data.phone || "";


                document.getElementById(
                    "college"
                ).value =
                    data.college || "";


                document.getElementById(
                    "course"
                ).value =
                    data.course || "";


                document.getElementById(
                    "education"
                ).value =
                    data.education || "";


                document.getElementById(
                    "bio"
                ).value =
                    data.bio || "";


                document.getElementById(
                    "resume"
                ).value =
                    data.resume || "";


                skills =
                    Array.isArray(data.skills)
                        ? data.skills
                        : [];


                displaySkills();

            } catch (error) {

                console.error(
                    "Profile loading error:",
                    error
                );

            }

        }


        // =========================================
        // DISPLAY SKILLS
        // =========================================

        function displaySkills() {

            const container =
                document.getElementById(
                    "skillsContainer"
                );


            container.innerHTML = "";


            skills.forEach(
                function(skill, index) {

                    const tag =
                        document.createElement(
                            "div"
                        );


                    tag.className =
                        "skill-tag";


                    tag.innerHTML = `

                        ${skill}

                        <button
                            type="button"
                            onclick="removeSkill(${index})">

                            <i class="fa-solid fa-xmark"></i>

                        </button>

                    `;


                    container.appendChild(tag);

                }
            );

        }


        // =========================================
        // ADD SKILL
        // =========================================

        function addSkill() {

            const input =
                document.getElementById(
                    "skillInput"
                );


            const skill =
                input.value.trim();


            if (!skill) {

                return;

            }


            if (
                skills.some(
                    item =>
                        item.toLowerCase() ===
                        skill.toLowerCase()
                )
            ) {

                input.value = "";

                return;

            }


            skills.push(skill);

            input.value = "";

            displaySkills();

        }


        // =========================================
        // ENTER KEY
        // =========================================

        document
            .getElementById("skillInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        addSkill();

                    }

                }
            );


        // =========================================
        // REMOVE SKILL
        // =========================================

        function removeSkill(index) {

            skills.splice(
                index,
                1
            );

            displaySkills();

        }


        // =========================================
        // SAVE PROFILE
        // =========================================

        async function saveProfile() {

            const message =
                document.getElementById(
                    "message"
                );


            const profileData = {

                phone:
                    document.getElementById(
                        "phone"
                    ).value.trim(),

                college:
                    document.getElementById(
                        "college"
                    ).value.trim(),

                course:
                    document.getElementById(
                        "course"
                    ).value.trim(),

                education:
                    document.getElementById(
                        "education"
                    ).value,

                skills:
                    skills,

                bio:
                    document.getElementById(
                        "bio"
                    ).value.trim(),

                resume:
                    document.getElementById(
                        "resume"
                    ).value.trim()

            };


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/profile`,
                        {
                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token

                            },

                            body:
                                JSON.stringify(
                                    profileData
                                )

                        }
                    );


                if (response.status === 401) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    window.location.href =
                        "login.html";

                    return;

                }


                const data =
                    await response.json();


                if (response.ok) {

                    message.style.color =
                        "#16a34a";

                    message.textContent =
                        "Profile saved successfully!";

                } else {

                    message.style.color =
                        "#dc2626";

                    message.textContent =
                        data.message ||
                        "Unable to save profile.";

                }

            } catch (error) {

                console.error(
                    "Profile save error:",
                    error
                );

                message.style.color =
                    "#dc2626";

                message.textContent =
                    "Unable to connect to server.";

            }

        }


        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "login.html";

        }


        // =========================================
        // LOAD PROFILE
        // =========================================

        if (token && user) {

            loadProfile();

        }

    </script>

</body>

</html>
