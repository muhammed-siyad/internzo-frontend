<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - INTERNZO</title>

    <link rel="stylesheet"
        href="css/dashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {
            margin-bottom: 40px;
        }

        .page-label {
            color: #8b5cf6;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .page-header h1 {
            color: #ffffff;
            font-size: clamp(36px, 5vw, 50px);
            line-height: 1.1;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
        }

        .page-header p {
            color: #a1a1aa;
            font-size: 15px;
            line-height: 1.6;
        }


        /* =========================================
           STATISTICS
        ========================================= */

        .admin-grid {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 20px;

            margin-bottom: 50px;

        }


        .admin-card {

            position: relative;

            padding: 25px;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.20);

            transition: 0.25s ease;

            overflow: hidden;

        }


        .admin-card::after {

            content: "";

            position: absolute;

            width: 100px;

            height: 100px;

            right: -45px;

            top: -45px;

            background:
                rgba(124, 58, 237, 0.08);

            border-radius: 50%;

        }


        .admin-card:hover {

            transform:
                translateY(-5px);

            border-color:
                rgba(124, 58, 237, 0.35);

            box-shadow:
                0 20px 55px
                rgba(0, 0, 0, 0.35);

        }


        .stat-icon {

            width: 45px;

            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 18px;

            background:
                rgba(124, 58, 237, 0.12);

            color: #8b5cf6;

            border:
                1px solid
                rgba(124, 58, 237, 0.18);

            border-radius: 11px;

            font-size: 18px;

        }


        .admin-card h3 {

            color: #71717a;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            margin-bottom: 9px;

        }


        .admin-card .number {

            color: #ffffff;

            font-size: 34px;

            line-height: 1;

            font-weight: 800;

        }


        /* =========================================
           SECTION
        ========================================= */

        .section {

            margin-top: 10px;

        }


        .section-header {

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            margin-bottom: 22px;

        }


        .section-title {

            color: #ffffff;

            font-size: 24px;

            margin: 0;

        }


        .section-subtitle {

            color: #71717a;

            font-size: 13px;

            margin-top: 6px;

        }


        /* =========================================
           INTERNSHIP LIST
        ========================================= */

        .internship-list {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;

        }


        /* =========================================
           INTERNSHIP CARD
        ========================================= */

        .internship-card {

            padding: 24px;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.20);

            transition: 0.25s ease;

            animation:
                cardAppear 0.35s ease both;

        }


        .internship-card:hover {

            transform:
                translateY(-5px);

            border-color:
                rgba(124, 58, 237, 0.35);

            box-shadow:
                0 20px 55px
                rgba(0, 0, 0, 0.35);

        }


        .internship-card h2 {

            color: #ffffff;

            font-size: 19px;

            line-height: 1.35;

            margin-bottom: 7px;

        }


        .company {

            color: #8b5cf6;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 16px;

        }


        /* =========================================
           STATUS
        ========================================= */

        .status {

            display: inline-flex;

            align-items: center;

            padding: 6px 11px;

            margin-bottom: 18px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;

        }


        .pending {

            background:
                rgba(245, 158, 11, 0.12);

            color: #fbbf24;

            border:
                1px solid
                rgba(245, 158, 11, 0.18);

        }


        .approved {

            background:
                rgba(34, 197, 94, 0.12);

            color: #4ade80;

            border:
                1px solid
                rgba(34, 197, 94, 0.18);

        }


        .rejected {

            background:
                rgba(239, 68, 68, 0.12);

            color: #f87171;

            border:
                1px solid
                rgba(239, 68, 68, 0.18);

        }


        /* =========================================
           INFO GRID
        ========================================= */

        .info {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            margin-bottom: 18px;

        }


        .info-box {

            padding: 12px;

            background: #0d0d0d;

            border:
                1px solid
                rgba(255, 255, 255, 0.06);

            border-radius: 11px;

        }


        .info-box small {

            display: block;

            color: #52525b;

            font-size: 10px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 5px;

        }


        .info-box strong {

            display: block;

            color: #d4d4d8;

            font-size: 12px;

            line-height: 1.4;

            word-break: break-word;

        }


        /* =========================================
           DESCRIPTION
        ========================================= */

        .description {

            color: #a1a1aa;

            font-size: 13px;

            line-height: 1.7;

            margin-bottom: 20px;

        }


        /* =========================================
           ACTION BUTTONS
        ========================================= */

        .action-buttons {

            display: flex;

            gap: 9px;

        }


        .action-buttons button {

            width: auto;

            flex: 1;

            min-height: 40px;

            padding: 9px 12px;

            border: none;

            border-radius: 9px;

            color: #ffffff;

            font-family: inherit;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .action-buttons button:hover {

            transform:
                translateY(-2px);

        }


        .approve-btn {

            background: #16a34a;

        }


        .approve-btn:hover {

            background: #15803d;

        }


        .reject-btn {

            background: #dc2626;

        }


        .reject-btn:hover {

            background: #b91c1c;

        }


        /* =========================================
           LOADING / EMPTY / ERROR
        ========================================= */

        .loading,
        .empty-state,
        .error-state {

            width: 100%;

            min-height: 260px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            grid-column: 1 / -1;

            padding: 50px 25px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            color: #71717a;

        }


        .state-icon {

            width: 58px;

            height: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 17px;

            background:
                rgba(124, 58, 237, 0.12);

            color: #8b5cf6;

            border:
                1px solid
                rgba(124, 58, 237, 0.18);

            border-radius: 14px;

            font-size: 23px;

        }


        .loading-spinner {

            width: 34px;

            height: 34px;

            margin-bottom: 15px;

            border:
                3px solid
                rgba(255, 255, 255, 0.08);

            border-top-color:
                #8b5cf6;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;

        }


        .empty-state h2,
        .error-state h2 {

            color: #ffffff;

            font-size: 18px;

            margin-bottom: 8px;

        }


        .empty-state p,
        .error-state p {

            color: #71717a;

            font-size: 14px;

            line-height: 1.6;

        }


        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(12px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 950px) {

            .admin-grid {

                grid-template-columns:
                    repeat(3, 1fr);

            }

            .internship-list {

                grid-template-columns: 1fr;

            }

        }


        @media (max-width: 750px) {

            .admin-grid {

                grid-template-columns:
                    1fr;

            }

            .section-header {

                align-items: flex-start;

            }

        }


        @media (max-width: 550px) {

            .page-header h1 {

                font-size: 36px;

            }

            .info {

                grid-template-columns: 1fr;

            }

            .action-buttons {

                flex-direction: column;

            }

            .action-buttons button {

                flex: none;

                width: 100%;

            }

            .internship-card {

                padding: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            INTERNZO
        </div>


        <div class="nav-links">

            <a
                href="admin-dashboard.html"
                class="active">

                Dashboard

            </a>


            <button
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="dashboard-container">


        <!-- PAGE HEADER -->

        <section class="page-header">

            <div class="page-label">
                ADMIN PORTAL
            </div>


            <h1>
                Admin Dashboard
            </h1>


            <p>
                Review and manage internship
                opportunities submitted by companies.
            </p>

        </section>


        <!-- =========================================
             STATISTICS
        ========================================= -->

        <section class="admin-grid">


            <!-- TOTAL -->

            <div class="admin-card">

                <div class="stat-icon">

                    <i class="fa-solid fa-briefcase"></i>

                </div>


                <h3>
                    Total Internships
                </h3>


                <div
                    class="number"
                    id="totalInternships">

                    0

                </div>

            </div>


            <!-- PENDING -->

            <div class="admin-card">

                <div class="stat-icon">

                    <i class="fa-solid fa-clock"></i>

                </div>


                <h3>
                    Pending Approval
                </h3>


                <div
                    class="number"
                    id="pendingInternships">

                    0

                </div>

            </div>


            <!-- APPROVED -->

            <div class="admin-card">

                <div class="stat-icon">

                    <i class="fa-solid fa-circle-check"></i>

                </div>


                <h3>
                    Approved Internships
                </h3>


                <div
                    class="number"
                    id="approvedInternships">

                    0

                </div>

            </div>


        </section>


        <!-- =========================================
             INTERNSHIP APPROVAL
        ========================================= -->

        <section class="section">


            <div class="section-header">

                <div>

                    <h2 class="section-title">
                        Internship Approval
                    </h2>


                    <p class="section-subtitle">

                        Review internship postings
                        submitted by companies.

                    </p>

                </div>

            </div>


            <div
                class="internship-list"
                id="internshipContainer">


                <div class="loading">

                    <div class="loading-spinner"></div>

                    <p>
                        Loading internships...
                    </p>

                </div>


            </div>

        </section>


    </main>


    <!-- =========================================
         API HELPER
    ========================================= -->

    <script src="js/api.js"></script>


    <script>

        // =========================================
        // LOGIN CHECK
        // =========================================

        const token =
            localStorage.getItem("token");


        const userData =
            localStorage.getItem("user");


        let user = null;


        try {

            user =
                userData
                    ? JSON.parse(userData)
                    : null;

        } catch (error) {

            console.error(
                "USER DATA ERROR:",
                error
            );

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "login.html";

        }


        if (!token || !user) {

            window.location.href =
                "login.html";

        }


        // =========================================
        // ADMIN ROLE CHECK
        // =========================================

        if (
            user &&
            user.role !== "admin"
        ) {

            if (
                user.role === "student"
            ) {

                window.location.href =
                    "student-dashboard.html";

            }

            else if (
                user.role === "company"
            ) {

                window.location.href =
                    "company-dashboard.html";

            }

            else {

                localStorage.removeItem(
                    "token"
                );

                localStorage.removeItem(
                    "user"
                );

                window.location.href =
                    "login.html";

            }

        }


        // =========================================
        // HTML ESCAPE
        // =========================================

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // =========================================
        // LOAD INTERNSHIPS
        // =========================================

        async function loadInternships() {

            const container =
                document.getElementById(
                    "internshipContainer"
                );


            container.innerHTML = `

                <div class="loading">

                    <div class="loading-spinner"></div>

                    <p>
                        Loading internships...
                    </p>

                </div>

            `;


            try {

                const data =
                    await apiFetch(
                        "/api/internships/admin/all"
                    );


                // =================================
                // STATISTICS
                // =================================

                const internships =
                    Array.isArray(data)
                        ? data
                        : [];


                document.getElementById(
                    "totalInternships"
                ).textContent =
                    internships.length;


                document.getElementById(
                    "pendingInternships"
                ).textContent =
                    internships.filter(
                        item =>
                            item.status === "Pending"
                    ).length;


                document.getElementById(
                    "approvedInternships"
                ).textContent =
                    internships.filter(
                        item =>
                            item.status === "Approved"
                    ).length;


                displayInternships(
                    internships
                );


            } catch (error) {

                console.error(
                    "LOAD INTERNSHIPS ERROR:",
                    error
                );


                container.innerHTML = `

                    <div class="error-state">

                        <div class="state-icon">

                            <i class="fa-solid fa-triangle-exclamation"></i>

                        </div>


                        <h2>
                            Unable to Load Internships
                        </h2>


                        <p>

                            ${
                                escapeHTML(
                                    error.message ||
                                    "Unable to connect to the INTERNZO server."
                                )
                            }

                        </p>

                    </div>

                `;

            }

        }


        // =========================================
        // DISPLAY INTERNSHIPS
        // =========================================

        function displayInternships(
            internships
        ) {

            const container =
                document.getElementById(
                    "internshipContainer"
                );


            if (
                !internships ||
                internships.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty-state">

                        <div class="state-icon">

                            <i class="fa-regular fa-folder-open"></i>

                        </div>


                        <h2>
                            No Internships Found
                        </h2>


                        <p>
                            No internship postings are available.
                        </p>

                    </div>

                `;

                return;

            }


            container.innerHTML =
                internships.map(
                    internship => {

                        const status =
                            internship.status ||
                            "Pending";


                        const statusClass =
                            status.toLowerCase();


                        const title =
                            escapeHTML(
                                internship.title ||
                                "Untitled Internship"
                            );


                        const companyName =
                            escapeHTML(
                                internship.companyName ||
                                "Unknown Company"
                            );


                        const location =
                            escapeHTML(
                                internship.location ||
                                "Not specified"
                            );


                        const type =
                            escapeHTML(
                                internship.type ||
                                "Not specified"
                            );


                        const duration =
                            escapeHTML(
                                internship.duration ||
                                "Not specified"
                            );


                        const stipend =
                            escapeHTML(
                                internship.stipend ||
                                "Unpaid"
                            );


                        const description =
                            escapeHTML(
                                internship.description ||
                                "No description available."
                            );


                        const internshipId =
                            escapeHTML(
                                internship._id
                            );


                        return `

                            <article
                                class="internship-card">


                                <h2>
                                    ${title}
                                </h2>


                                <div class="company">

                                    <i
                                        class="fa-solid fa-building">
                                    </i>

                                    ${companyName}

                                </div>


                                <span
                                    class="status ${statusClass}">

                                    ${escapeHTML(status)}

                                </span>


                                <div class="info">


                                    <div class="info-box">

                                        <small>
                                            Location
                                        </small>

                                        <strong>
                                            ${location}
                                        </strong>

                                    </div>


                                    <div class="info-box">

                                        <small>
                                            Type
                                        </small>

                                        <strong>
                                            ${type}
                                        </strong>

                                    </div>


                                    <div class="info-box">

                                        <small>
                                            Duration
                                        </small>

                                        <strong>
                                            ${duration}
                                        </strong>

                                    </div>


                                    <div class="info-box">

                                        <small>
                                            Stipend
                                        </small>

                                        <strong>
                                            ${stipend}
                                        </strong>

                                    </div>


                                </div>


                                <div class="description">

                                    ${description}

                                </div>


                                ${
                                    status === "Pending"
                                        ? `

                                            <div
                                                class="action-buttons">

                                                <button
                                                    class="approve-btn"
                                                    onclick="updateStatus(
                                                        '${internshipId}',
                                                        'Approved'
                                                    )">

                                                    <i
                                                        class="fa-solid fa-check">
                                                    </i>

                                                    Approve

                                                </button>


                                                <button
                                                    class="reject-btn"
                                                    onclick="updateStatus(
                                                        '${internshipId}',
                                                        'Rejected'
                                                    )">

                                                    <i
                                                        class="fa-solid fa-xmark">
                                                    </i>

                                                    Reject

                                                </button>

                                            </div>

                                        `
                                        : ""

                                }


                            </article>

                        `;

                    }
                ).join("");

        }


        // =========================================
        // UPDATE INTERNSHIP STATUS
        // =========================================

        async function updateStatus(
            internshipId,
            status
        ) {

            const confirmMessage =
                status === "Approved"
                    ? "Approve this internship?"
                    : "Reject this internship?";


            if (
                !confirm(confirmMessage)
            ) {

                return;

            }


            try {

                const data =
                    await apiFetch(
                        `/api/internships/admin/status/${internshipId}`,
                        {
                            method: "PUT",

                            body:
                                JSON.stringify({
                                    status
                                })
                        }
                    );


                alert(
                    data.message ||
                    "Status updated successfully."
                );


                await loadInternships();


                // Clear internship cache so
                // students get the latest data.

                if (
                    typeof clearInternshipCache ===
                    "function"
                ) {

                    clearInternshipCache();

                }


            } catch (error) {

                console.error(
                    "UPDATE STATUS ERROR:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to update internship status."
                );

            }

        }


        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );


            window.location.href =
                "login.html";

        }


        // =========================================
        // START
        // =========================================

        loadInternships();

    </script>

</body>

</html>
