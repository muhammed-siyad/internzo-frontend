<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - INTERNZO</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <style>

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 30px;
            color: #111827;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #64748b;
            font-size: 14px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .admin-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 24px;
            box-shadow: 0 5px 15px rgba(17, 24, 39, 0.04);
        }

        .admin-card h3 {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .admin-card .number {
            color: #7c3aed;
            font-size: 30px;
            font-weight: 800;
        }

        .section {
            margin-top: 25px;
        }

        .section-title {
            color: #111827;
            font-size: 21px;
            margin-bottom: 18px;
        }

        .internship-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .internship-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 24px;
            box-shadow: 0 5px 15px rgba(17, 24, 39, 0.04);
        }

        .internship-card h2 {
            color: #111827;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .company {
            color: #7c3aed;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .info-box {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
        }

        .info-box small {
            display: block;
            color: #94a3b8;
            font-size: 10px;
            margin-bottom: 4px;
        }

        .info-box strong {
            color: #334155;
            font-size: 12px;
        }

        .description {
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .approved {
            background: #dcfce7;
            color: #166534;
        }

        .rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            width: auto;
            flex: 1;
            padding: 10px;
            font-size: 13px;
        }

        .approve-btn {
            background: #16a34a;
        }

        .approve-btn:hover {
            background: #15803d;
        }

        .reject-btn {
            background: #dc2626;
        }

        .reject-btn:hover {
            background: #b91c1c;
        }

        .loading,
        .empty-state,
        .error-state {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 50px 25px;
            text-align: center;
            color: #64748b;
            grid-column: 1 / -1;
        }

        .empty-state h2,
        .error-state h2 {
            color: #334155;
            margin-bottom: 8px;
        }

        @media (max-width: 900px) {

            .admin-grid {
                grid-template-columns: 1fr;
            }

            .internship-list {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 550px) {

            .info {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            INTERNZO
        </div>

        <div class="nav-links">

            <a href="admin-dashboard.html" class="active">
                Dashboard
            </a>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <!-- MAIN -->

    <main class="dashboard-container">

        <div class="page-header">

            <h1>
                Admin Dashboard
            </h1>

            <p>
                Manage and approve internship opportunities.
            </p>

        </div>


        <!-- STATISTICS -->

        <div class="admin-grid">

            <div class="admin-card">

                <h3>
                    Total Internships
                </h3>

                <div
                    class="number"
                    id="totalInternships"
                >
                    0
                </div>

            </div>


            <div class="admin-card">

                <h3>
                    Pending Approval
                </h3>

                <div
                    class="number"
                    id="pendingInternships"
                >
                    0
                </div>

            </div>


            <div class="admin-card">

                <h3>
                    Approved Internships
                </h3>

                <div
                    class="number"
                    id="approvedInternships"
                >
                    0
                </div>

            </div>

        </div>


        <!-- INTERNSHIP APPROVAL -->

        <section class="section">

            <h2 class="section-title">
                Internship Approval
            </h2>


            <div
                class="internship-list"
                id="internshipContainer"
            >

                <div class="loading">
                    Loading internships...
                </div>

            </div>

        </section>

    </main>


    <script>

        // ==========================================
        // API URL
        // ==========================================

        const API_URL =
            "https://internzo-backend.onrender.com";


        // ==========================================
        // LOGIN CHECK
        // ==========================================

        const token =
            localStorage.getItem("token");

        const userData =
            localStorage.getItem("user");


        if (!token || !userData) {

            window.location.href =
                "login.html";

        }


        let user;

        try {

            user =
                JSON.parse(userData);

        } catch (error) {

            localStorage.clear();

            window.location.href =
                "login.html";

        }


        // ==========================================
        // ADMIN ROLE CHECK
        // ==========================================

        if (
            user &&
            user.role !== "admin"
        ) {

            alert(
                "Only administrators can access this page."
            );

            window.location.href =
                "login.html";

        }


        // ==========================================
        // LOAD INTERNSHIPS
        // ==========================================

        async function loadInternships() {

            const container =
                document.getElementById(
                    "internshipContainer"
                );


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/internships/admin/all`,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json();


                // ==========================================
                // HANDLE UNAUTHORIZED
                // ==========================================

                if (response.status === 401) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    alert(
                        "Your session has expired. Please login again."
                    );

                    window.location.href =
                        "login.html";

                    return;

                }


                // ==========================================
                // HANDLE ERROR
                // ==========================================

                if (!response.ok) {

                    container.innerHTML = `

                        <div class="error-state">

                            <h2>
                                Unable to load internships
                            </h2>

                            <p>
                                ${data.message || "Something went wrong."}
                            </p>

                        </div>

                    `;

                    return;

                }


                // ==========================================
                // STATISTICS
                // ==========================================

                document.getElementById(
                    "totalInternships"
                ).textContent =
                    data.length;


                document.getElementById(
                    "pendingInternships"
                ).textContent =
                    data.filter(
                        item =>
                            item.status === "Pending"
                    ).length;


                document.getElementById(
                    "approvedInternships"
                ).textContent =
                    data.filter(
                        item =>
                            item.status === "Approved"
                    ).length;


                // ==========================================
                // DISPLAY
                // ==========================================

                displayInternships(data);


            } catch (error) {

                console.error(
                    "LOAD INTERNSHIPS ERROR:",
                    error
                );


                container.innerHTML = `

                    <div class="error-state">

                        <h2>
                            Server Connection Error
                        </h2>

                        <p>
                            Unable to connect to the INTERNZO server.
                        </p>

                    </div>

                `;

            }

        }


        // ==========================================
        // DISPLAY INTERNSHIPS
        // ==========================================

        function displayInternships(
            internships
        ) {

            const container =
                document.getElementById(
                    "internshipContainer"
                );


            if (
                !internships ||
                internships.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty-state">

                        <h2>
                            No Internships Found
                        </h2>

                        <p>
                            No internship postings are available.
                        </p>

                    </div>

                `;

                return;

            }


            container.innerHTML =
                internships.map(
                    internship => {

                        const status =
                            internship.status
                                ? internship.status.toLowerCase()
                                : "pending";


                        return `

                            <div class="internship-card">

                                <h2>
                                    ${internship.title}
                                </h2>


                                <div class="company">
                                    ${internship.companyName}
                                </div>


                                <div class="status ${status}">
                                    ${internship.status}
                                </div>


                                <div class="info">

                                    <div class="info-box">

                                        <small>
                                            Location
                                        </small>

                                        <strong>
                                            ${internship.location}
                                        </strong>

                                    </div>


                                    <div class="info-box">

                                        <small>
                                            Type
                                        </small>

                                        <strong>
                                            ${internship.type}
                                        </strong>

                                    </div>


                                    <div class="info-box">

                                        <small>
                                            Duration
                                        </small>

                                        <strong>
                                            ${internship.duration}
                                        </strong>

                                    </div>


                                    <div class="info-box">

                                        <small>
                                            Stipend
                                        </small>

                                        <strong>
                                            ${internship.stipend || "Unpaid"}
                                        </strong>

                                    </div>

                                </div>


                                <div class="description">

                                    ${internship.description}

                                </div>


                                ${
                                    internship.status === "Pending"

                                    ? `

                                        <div class="action-buttons">

                                            <button
                                                class="approve-btn"
                                                onclick="updateStatus('${internship._id}', 'Approved')"
                                            >
                                                Approve
                                            </button>


                                            <button
                                                class="reject-btn"
                                                onclick="updateStatus('${internship._id}', 'Rejected')"
                                            >
                                                Reject
                                            </button>

                                        </div>

                                    `

                                    : ""

                                }

                            </div>

                        `;

                    }
                ).join("");

        }


        // ==========================================
        // UPDATE INTERNSHIP STATUS
        // ==========================================

        async function updateStatus(
            internshipId,
            status
        ) {

            const confirmMessage =
                status === "Approved"
                    ? "Approve this internship?"
                    : "Reject this internship?";


            if (!confirm(confirmMessage)) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/internships/admin/status/${internshipId}`,
                        {
                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token

                            },

                            body: JSON.stringify({

                                status: status

                            })

                        }
                    );


                const data =
                    await response.json();


                // ==========================================
                // HANDLE EXPIRED TOKEN
                // ==========================================

                if (response.status === 401) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    alert(
                        "Your session has expired. Please login again."
                    );

                    window.location.href =
                        "login.html";

                    return;

                }


                // ==========================================
                // SUCCESS
                // ==========================================

                if (response.ok) {

                    alert(
                        data.message ||
                        "Status updated successfully."
                    );


                    loadInternships();

                } else {

                    alert(
                        data.message ||
                        "Unable to update status."
                    );

                }

            } catch (error) {

                console.error(
                    "UPDATE STATUS ERROR:",
                    error
                );


                alert(
                    "Unable to connect to the server."
                );

            }

        }


        // ==========================================
        // LOGOUT
        // ==========================================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );


            window.location.href =
                "login.html";

        }


        // ==========================================
        // START
        // ==========================================

        loadInternships();

    </script>

</body>

</html>
