<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Applications - INTERNZO</title>

    <link rel="stylesheet"
        href="css/dashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {
            margin-bottom: 35px;
        }

        .page-label {
            color: #8b5cf6;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .page-header h1 {
            color: #ffffff;
            font-size: clamp(34px, 5vw, 48px);
            line-height: 1.1;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
        }

        .page-header p {
            color: #a1a1aa;
            font-size: 15px;
            line-height: 1.6;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {
            min-height: 22px;
            text-align: center;
            margin-bottom: 18px;
            font-size: 14px;
            font-weight: 600;
        }

        .message.success {
            color: #4ade80;
        }

        .message.error {
            color: #f87171;
        }


        /* =========================================
           APPLICATIONS CONTAINER
        ========================================= */

        .applications-container {
            width: 100%;
            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );
            border:
                1px solid
                rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 10px;
            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.25);
            overflow-x: auto;
        }


        /* =========================================
           TABLE
        ========================================= */

        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 17px 15px;
            color: #71717a;
            background: #0d0d0d;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.08);
        }

        td {
            padding: 18px 15px;
            color: #d4d4d8;
            font-size: 13px;
            vertical-align: middle;
            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.06);
        }

        tbody tr {
            transition: 0.2s ease;
        }

        tbody tr:hover {
            background:
                rgba(124, 58, 237, 0.045);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }


        /* =========================================
           STUDENT
        ========================================= */

        .student-name {
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .student-email {
            color: #71717a;
            font-size: 12px;
            line-height: 1.5;
        }


        /* =========================================
           INTERNSHIP
        ========================================= */

        .internship-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 5px;
        }


        /* =========================================
           STATUS
        ========================================= */

        .status {
            display: inline-flex;
            align-items: center;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-applied {
            background:
                rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border:
                1px solid
                rgba(245, 158, 11, 0.18);
        }

        .status-shortlisted {
            background:
                rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            border:
                1px solid
                rgba(59, 130, 246, 0.18);
        }

        .status-selected {
            background:
                rgba(34, 197, 94, 0.12);
            color: #4ade80;
            border:
                1px solid
                rgba(34, 197, 94, 0.18);
        }

        .status-rejected {
            background:
                rgba(239, 68, 68, 0.12);
            color: #f87171;
            border:
                1px solid
                rgba(239, 68, 68, 0.18);
        }


        /* =========================================
           ACTION BUTTONS
        ========================================= */

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            width: auto;
            min-height: 34px;
            padding: 7px 11px;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .action-buttons button:hover {
            transform: translateY(-2px);
        }

        .shortlist-btn {
            background: #2563eb;
        }

        .shortlist-btn:hover {
            background: #1d4ed8;
        }

        .select-btn {
            background: #16a34a;
        }

        .select-btn:hover {
            background: #15803d;
        }

        .reject-btn {
            background: #dc2626;
        }

        .reject-btn:hover {
            background: #b91c1c;
        }

        .action-buttons button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }


        /* =========================================
           EMPTY / ERROR STATE
        ========================================= */

        .empty-box {
            text-align: center;
            padding: 70px 25px;
        }

        .empty-box .icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            background:
                rgba(124, 58, 237, 0.12);
            color: #8b5cf6;
            border:
                1px solid
                rgba(124, 58, 237, 0.18);
            border-radius: 15px;
            font-size: 25px;
        }

        .empty-box h3 {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 9px;
        }

        .empty-box p {
            max-width: 500px;
            margin: 0 auto;
            color: #71717a;
            font-size: 14px;
            line-height: 1.7;
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: #71717a;
        }

        .loading-spinner {
            width: 34px;
            height: 34px;
            margin-bottom: 15px;
            border:
                3px solid
                rgba(255, 255, 255, 0.08);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================
           RESPONSIVE NAVBAR
        ========================================= */

        .menu-toggle {

            display: none;

            width: 44px;
            height: 44px;

            padding: 0;

            background: transparent;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 10px;

            cursor: pointer;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            gap: 5px;

        }


        .menu-toggle span {

            display: block;

            width: 20px;
            height: 2px;

            background: #ffffff;

            border-radius: 5px;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;

        }


        @media (max-width: 800px) {

            .navbar {

                position: sticky;

                top: 0;

                z-index: 1000;

                padding:
                    14px 5%;

                min-height: 70px;

                box-sizing: border-box;

            }


            .menu-toggle {

                display: flex;

            }


            .nav-links {

                position: absolute;

                top:
                    calc(100% + 1px);

                left: 5%;
                right: 5%;

                width: auto;

                display: flex;

                flex-direction: column;

                align-items: stretch;

                gap: 5px;

                padding: 12px;

                background:
                    rgba(10, 10, 10, 0.98);

                border:
                    1px solid
                    rgba(255, 255, 255, 0.08);

                border-radius: 14px;

                box-shadow:
                    0 20px 50px
                    rgba(0, 0, 0, 0.45);

                opacity: 0;

                visibility: hidden;

                transform:
                    translateY(-10px);

                transition:
                    opacity 0.25s ease,
                    visibility 0.25s ease,
                    transform 0.25s ease;

            }


            .nav-links.active {

                opacity: 1;

                visibility: visible;

                transform:
                    translateY(0);

            }


            .nav-links a,
            .nav-links button {

                width: 100%;

                box-sizing: border-box;

                padding:
                    13px 14px;

                text-align: left;

                border-radius: 9px;

                font-size: 14px;

            }


            .nav-links a:hover,
            .nav-links a.active {

                background:
                    rgba(124, 58, 237, 0.12);

            }


            .nav-links button {

                margin-top: 4px;

            }


            /* HAMBURGER -> X */

            .menu-toggle.active
            span:nth-child(1) {

                transform:
                    translateY(7px)
                    rotate(45deg);

            }


            .menu-toggle.active
            span:nth-child(2) {

                opacity: 0;

            }


            .menu-toggle.active
            span:nth-child(3) {

                transform:
                    translateY(-7px)
                    rotate(-45deg);

            }


            /* TABLE */

            .applications-container {

                padding: 7px;

            }


            .page-header h1 {

                font-size: 38px;

            }

        }


        @media (max-width: 550px) {

            .navbar {

                padding:
                    13px 4%;

            }


            .nav-links {

                left: 4%;
                right: 4%;

            }


            .page-header {

                margin-bottom: 28px;

            }


            .page-header h1 {

                font-size: 32px;

                letter-spacing: -1px;

            }


            .page-header p {

                font-size: 14px;

            }


            .applications-container {

                border-radius: 16px;

            }


            .empty-box {

                padding:
                    55px 18px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            INTERNZO
        </div>


        <div
            class="nav-links"
            id="navLinks">

            <a href="company-dashboard.html">
                Dashboard
            </a>


            <a href="post-internship.html">
                Post Internship
            </a>


            <a href="manage-internships.html">
                My Internships
            </a>


            <a
                href="company-applications.html"
                class="active">

                Applications

            </a>


            <a href="company-profile.html">
                Profile
            </a>


            <button onclick="logout()">
                Logout
            </button>

        </div>


        <button
            class="menu-toggle"
            id="menuToggle"
            aria-label="Toggle navigation"
            aria-expanded="false">

            <span></span>
            <span></span>
            <span></span>

        </button>

    </nav>


    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="dashboard-container">


        <section class="page-header">

            <div class="page-label">
                COMPANY PORTAL
            </div>


            <h1>
                Applications
            </h1>


            <p>
                Review students who have applied
                for your internships.
            </p>

        </section>


        <div
            id="message"
            class="message">
        </div>


        <div class="applications-container">

            <div id="applicationsContent">

                <div class="loading-state">

                    <div class="loading-spinner"></div>

                    <p>
                        Loading applications...
                    </p>

                </div>

            </div>

        </div>


    </main>


    <script src="js/api.js"></script>


    <script>

        // =========================================
        // MOBILE NAVBAR
        // =========================================

        const menuToggle =
            document.getElementById("menuToggle");

        const navLinks =
            document.getElementById("navLinks");


        if (menuToggle && navLinks) {

            menuToggle.addEventListener(
                "click",
                function () {

                    menuToggle.classList.toggle(
                        "active"
                    );

                    navLinks.classList.toggle(
                        "active"
                    );


                    const isOpen =
                        navLinks.classList.contains(
                            "active"
                        );


                    menuToggle.setAttribute(
                        "aria-expanded",
                        isOpen
                    );

                }
            );


            // Close after clicking a link

            document
                .querySelectorAll(
                    ".nav-links a"
                )
                .forEach(
                    function (link) {

                        link.addEventListener(
                            "click",
                            function () {

                                menuToggle.classList.remove(
                                    "active"
                                );

                                navLinks.classList.remove(
                                    "active"
                                );

                                menuToggle.setAttribute(
                                    "aria-expanded",
                                    "false"
                                );

                            }
                        );

                    }
                );


            // Close when clicking outside

            document.addEventListener(
                "click",
                function (event) {

                    if (
                        !navLinks.contains(
                            event.target
                        ) &&
                        !menuToggle.contains(
                            event.target
                        )
                    ) {

                        menuToggle.classList.remove(
                            "active"
                        );

                        navLinks.classList.remove(
                            "active"
                        );

                        menuToggle.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }

                }
            );


            // Close with Escape

            document.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Escape"
                    ) {

                        menuToggle.classList.remove(
                            "active"
                        );

                        navLinks.classList.remove(
                            "active"
                        );

                        menuToggle.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }

                }
            );

        }


        // =========================================
        // LOGIN CHECK
        // =========================================

        const token =
            localStorage.getItem("token");

        const userData =
            localStorage.getItem("user");

        let user = null;


        try {

            user =
                userData
                    ? JSON.parse(userData)
                    : null;

        } catch (error) {

            console.error(
                "USER DATA ERROR:",
                error
            );

            localStorage.removeItem("token");
            localStorage.removeItem("user");

            window.location.href =
                "login.html";

        }


        // =========================================
        // AUTH CHECK
        // =========================================

        if (!token || !user) {

            window.location.href =
                "login.html";

        }


        // =========================================
        // ROLE CHECK
        // =========================================

        if (
            user &&
            user.role !== "company"
        ) {

            if (
                user.role === "student"
            ) {

                window.location.href =
                    "student-dashboard.html";

            }

            else if (
                user.role === "admin"
            ) {

                window.location.href =
                    "admin-dashboard.html";

            }

            else {

                localStorage.removeItem(
                    "token"
                );

                localStorage.removeItem(
                    "user"
                );

                window.location.href =
                    "login.html";

            }

        }


        // =========================================
        // HTML ESCAPE
        // =========================================

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // =========================================
        // STATUS CLASS
        // =========================================

        function getStatusClass(status) {

            switch (status) {

                case "Shortlisted":
                    return "status-shortlisted";

                case "Selected":
                    return "status-selected";

                case "Rejected":
                    return "status-rejected";

                default:
                    return "status-applied";

            }

        }


        // =========================================
        // LOAD APPLICATIONS
        // =========================================

        async function loadApplications() {

            const content =
                document.getElementById(
                    "applicationsContent"
                );


            content.innerHTML = `

                <div class="loading-state">

                    <div class="loading-spinner"></div>

                    <p>
                        Loading applications...
                    </p>

                </div>

            `;


            try {

                const data =
                    await apiFetch(
                        "/api/applications/company-applications"
                    );


                if (
                    !data ||
                    data.length === 0
                ) {

                    content.innerHTML = `

                        <div class="empty-box">

                            <div class="icon">

                                <i class="fa-regular fa-file-lines"></i>

                            </div>

                            <h3>
                                No Applications Yet
                            </h3>

                            <p>
                                Students who apply
                                for your internships
                                will appear here.
                            </p>

                        </div>

                    `;

                    return;

                }


                let html = `

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Student
                                </th>

                                <th>
                                    Internship
                                </th>

                                <th>
                                    Applied On
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                `;


                data.forEach(
                    application => {

                        const student =
                            application.student ||
                            {};

                        const internship =
                            application.internship ||
                            {};


                        const appliedDate =
                            application.createdAt
                                ? new Date(
                                    application.createdAt
                                ).toLocaleDateString(
                                    "en-IN",
                                    {
                                        day: "2-digit",
                                        month: "short",
                                        year: "numeric"
                                    }
                                )
                                : "N/A";


                        const status =
                            application.status ||
                            "Applied";


                        const safeId =
                            escapeHTML(
                                application._id
                            );


                        const studentName =
                            escapeHTML(
                                student.name ||
                                "Unknown Student"
                            );


                        const studentEmail =
                            escapeHTML(
                                student.email ||
                                ""
                            );


                        const internshipTitle =
                            escapeHTML(
                                internship.title ||
                                "Internship"
                            );


                        const location =
                            escapeHTML(
                                internship.location ||
                                ""
                            );


                        const safeStatus =
                            escapeHTML(
                                status
                            );


                        const statusClass =
                            getStatusClass(
                                status
                            );


                        html += `

                            <tr>

                                <td>

                                    <div class="student-name">
                                        ${studentName}
                                    </div>

                                    ${
                                        studentEmail
                                            ? `
                                                <div class="student-email">
                                                    ${studentEmail}
                                                </div>
                                            `
                                            : ""
                                    }

                                </td>


                                <td>

                                    <div class="internship-title">
                                        ${internshipTitle}
                                    </div>

                                    ${
                                        location
                                            ? `
                                                <div class="student-email">
                                                    ${location}
                                                </div>
                                            `
                                            : ""
                                    }

                                </td>


                                <td>
                                    ${appliedDate}
                                </td>


                                <td>

                                    <span
                                        class="status ${statusClass}">

                                        ${safeStatus}

                                    </span>

                                </td>


                                <td>

                                    <div class="action-buttons">

                                        <button
                                            class="shortlist-btn"
                                            onclick="updateStatus(
                                                '${safeId}',
                                                'Shortlisted'
                                            )">

                                            Shortlist

                                        </button>


                                        <button
                                            class="select-btn"
                                            onclick="updateStatus(
                                                '${safeId}',
                                                'Selected'
                                            )">

                                            Select

                                        </button>


                                        <button
                                            class="reject-btn"
                                            onclick="updateStatus(
                                                '${safeId}',
                                                'Rejected'
                                            )">

                                            Reject

                                        </button>

                                    </div>

                                </td>

                            </tr>

                        `;

                    }
                );


                html += `

                        </tbody>

                    </table>

                `;


                content.innerHTML =
                    html;


            } catch (error) {

                console.error(
                    "LOAD APPLICATIONS ERROR:",
                    error
                );


                content.innerHTML = `

                    <div class="empty-box">

                        <div class="icon">

                            <i class="fa-solid fa-triangle-exclamation"></i>

                        </div>

                        <h3>
                            Unable to Load Applications
                        </h3>

                        <p>
                            ${
                                escapeHTML(
                                    error.message ||
                                    "Something went wrong."
                                )
                            }
                        </p>

                    </div>

                `;

            }

        }


        // =========================================
        // UPDATE APPLICATION STATUS
        // =========================================

        async function updateStatus(
            applicationId,
            status
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.className =
                "message";

            message.textContent =
                "Updating application...";


            try {

                const data =
                    await apiFetch(
                        `/api/applications/status/${applicationId}`,
                        {
                            method: "PUT",

                            body:
                                JSON.stringify({
                                    status
                                })
                        }
                    );


                message.className =
                    "message success";

                message.textContent =
                    data.message ||
                    "Application status updated successfully.";


                await loadApplications();


                setTimeout(
                    () => {

                        message.textContent =
                            "";

                    },
                    3000
                );


            } catch (error) {

                console.error(
                    "UPDATE STATUS ERROR:",
                    error
                );


                message.className =
                    "message error";

                message.textContent =
                    error.message ||
                    "Unable to update application.";

            }

        }


        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "login.html";

        }


        // =========================================
        // START
        // =========================================

        loadApplications();

    </script>


</body>

</html>
