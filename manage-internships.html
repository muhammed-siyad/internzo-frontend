<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Internships - INTERNZO</title>

    <link rel="stylesheet"
        href="css/dashboard.css">

    <style>

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 30px;
            color: #111827;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #64748b;
            font-size: 14px;
        }

        .internship-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .internship-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 25px;

            box-shadow:
                0 5px 15px
                rgba(17, 24, 39, 0.04);

            transition: 0.25s ease;
        }

        .internship-card:hover {
            transform: translateY(-4px);

            border-color: #c4b5fd;

            box-shadow:
                0 15px 30px
                rgba(124, 58, 237, 0.10);
        }

        .internship-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 15px;

            margin-bottom: 18px;
        }

        .internship-title {
            color: #111827;

            font-size: 19px;

            font-weight: 700;

            margin-bottom: 6px;
        }

        .company-name {
            color: #7c3aed;

            font-size: 13px;

            font-weight: 600;
        }

        .status {
            padding: 6px 11px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;

            white-space: nowrap;
        }

        .status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status.approved {
            background: #dcfce7;
            color: #166534;
        }

        .status.rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .details {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-bottom: 20px;
        }

        .detail-box {
            background: #f8fafc;

            border-radius: 9px;

            padding: 11px;
        }

        .detail-box span {
            display: block;

            color: #94a3b8;

            font-size: 11px;

            margin-bottom: 4px;
        }

        .detail-box strong {
            color: #334155;

            font-size: 13px;

            font-weight: 600;
        }

        .description {
            color: #64748b;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 18px;
        }

        .skills {
            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-bottom: 20px;
        }

        .skill {
            background: #f3e8ff;

            color: #7c3aed;

            padding: 5px 9px;

            border-radius: 6px;

            font-size: 11px;

            font-weight: 600;
        }

        .deadline {
            color: #64748b;

            font-size: 12px;

            border-top:
                1px solid #e5e7eb;

            padding-top: 15px;
        }

        .empty-state {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            padding: 60px 25px;

            text-align: center;

            box-shadow:
                0 5px 15px
                rgba(17, 24, 39, 0.04);
        }

        .empty-icon {
            width: 65px;

            height: 65px;

            background: #f3e8ff;

            color: #7c3aed;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 18px;

            font-size: 27px;
        }

        .empty-state h2 {
            color: #334155;

            font-size: 19px;

            margin-bottom: 8px;
        }

        .empty-state p {
            color: #64748b;

            font-size: 14px;

            margin-bottom: 22px;
        }

        .empty-state a {
            display: inline-block;

            background: #7c3aed;

            color: #ffffff;

            text-decoration: none;

            padding: 11px 20px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: 600;
        }

        .empty-state a:hover {
            background: #6d28d9;
        }

        .loading {
            text-align: center;

            padding: 50px;

            color: #64748b;

            font-size: 14px;
        }

        .error-message {
            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fecaca;

            padding: 15px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;
        }

        @media (max-width: 800px) {

            .internship-list {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 500px) {

            .internship-top {
                flex-direction: column;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <nav class="navbar">

        <div class="logo">
            INTERNZO
        </div>


        <div class="nav-links">

            <a href="company-dashboard.html">
                Dashboard
            </a>


            <a href="post-internship.html">
                Post Internship
            </a>


            <a href="manage-internships.html"
               class="active">

                My Internships

            </a>


            <a href="company-applications.html">
                Applications
            </a>


            <a href="company-profile.html">
                Profile
            </a>


            <button onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="dashboard-container">


        <div class="page-header">

            <h1>
                My Internships
            </h1>


            <p>
                Manage and monitor the internships posted by your company.
            </p>

        </div>


        <!-- =========================================
             INTERNSHIP CONTENT
        ========================================== -->

        <div id="internshipContainer">

            <div class="loading">
                Loading internships...
            </div>

        </div>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        // =========================================
        // BACKEND API URL
        // =========================================

        const API_URL =
            "https://internzo-backend.onrender.com";


        // =========================================
        // CHECK LOGIN
        // =========================================

        const token =
            localStorage.getItem("token");


        const userData =
            localStorage.getItem("user");


        if (!token || !userData) {

            window.location.href =
                "login.html";

        }


        let user;


        try {

            user =
                JSON.parse(userData);

        } catch (error) {

            localStorage.clear();

            window.location.href =
                "login.html";

        }


        // =========================================
        // CHECK COMPANY ROLE
        // =========================================

        if (
            user &&
            user.role !== "company"
        ) {

            alert("Access denied");

            window.location.href =
                "student-dashboard.html";

        }


        // =========================================
        // LOAD INTERNSHIPS
        // =========================================

        async function loadInternships() {

            const container =
                document.getElementById(
                    "internshipContainer"
                );


            try {

                // =========================================
                // API REQUEST
                // =========================================

                const response =
                    await fetch(
                        `${API_URL}/api/internships/my-internships`,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json();


                // =========================================
                // CHECK RESPONSE
                // =========================================

                if (!response.ok) {

                    // Token expired

                    if (
                        response.status === 401
                    ) {

                        localStorage.removeItem(
                            "token"
                        );

                        localStorage.removeItem(
                            "user"
                        );

                        window.location.href =
                            "login.html";

                        return;

                    }


                    container.innerHTML = `

                        <div class="error-message">

                            ${
                                data.message ||
                                "Unable to load internships."
                            }

                        </div>

                    `;

                    return;

                }


                // =========================================
                // NO INTERNSHIPS
                // =========================================

                if (
                    !data ||
                    data.length === 0
                ) {

                    container.innerHTML = `

                        <div class="empty-state">


                            <div class="empty-icon">

                                <i class="fa-solid fa-briefcase"></i>

                            </div>


                            <h2>
                                No Internships Posted
                            </h2>


                            <p>
                                You haven't posted any internships yet.
                            </p>


                            <a
                                href="post-internship.html">

                                Post Your First Internship

                            </a>


                        </div>

                    `;

                    return;

                }


                // =========================================
                // DISPLAY INTERNSHIPS
                // =========================================

                container.innerHTML = `

                    <div class="internship-list">

                        ${data.map(
                            internship => {

                                // =========================================
                                // CREATED DATE
                                // =========================================

                                const createdDate =
                                    internship.createdAt
                                        ? new Date(
                                            internship.createdAt
                                        ).toLocaleDateString(
                                            "en-IN",
                                            {
                                                day: "2-digit",
                                                month: "short",
                                                year: "numeric"
                                            }
                                        )
                                        : "N/A";


                                // =========================================
                                // DEADLINE DATE
                                // =========================================

                                const deadlineDate =
                                    internship.deadline
                                        ? new Date(
                                            internship.deadline
                                        ).toLocaleDateString(
                                            "en-IN",
                                            {
                                                day: "2-digit",
                                                month: "short",
                                                year: "numeric"
                                            }
                                        )
                                        : "N/A";


                                // =========================================
                                // STATUS
                                // =========================================

                                const status =
                                    internship.status
                                        ? internship.status.toLowerCase()
                                        : "pending";


                                // =========================================
                                // SKILLS
                                // =========================================

                                const skills =
                                    Array.isArray(
                                        internship.skills
                                    )
                                        ? internship.skills
                                        : [];


                                // =========================================
                                // RETURN CARD
                                // =========================================

                                return `

                                    <div class="internship-card">


                                        <div class="internship-top">


                                            <div>

                                                <div class="internship-title">

                                                    ${
                                                        internship.title ||
                                                        "Untitled Internship"
                                                    }

                                                </div>


                                                <div class="company-name">

                                                    ${
                                                        internship.companyName ||
                                                        "Company"
                                                    }

                                                </div>

                                            </div>


                                            <div
                                                class="status ${status}">

                                                ${
                                                    internship.status ||
                                                    "Pending"
                                                }

                                            </div>


                                        </div>


                                        <div class="details">


                                            <div class="detail-box">

                                                <span>
                                                    Location
                                                </span>


                                                <strong>

                                                    ${
                                                        internship.location ||
                                                        "Not specified"
                                                    }

                                                </strong>

                                            </div>


                                            <div class="detail-box">

                                                <span>
                                                    Type
                                                </span>


                                                <strong>

                                                    ${
                                                        internship.type ||
                                                        "Not specified"
                                                    }

                                                </strong>

                                            </div>


                                            <div class="detail-box">

                                                <span>
                                                    Duration
                                                </span>


                                                <strong>

                                                    ${
                                                        internship.duration ||
                                                        "Not specified"
                                                    }

                                                </strong>

                                            </div>


                                            <div class="detail-box">

                                                <span>
                                                    Stipend
                                                </span>


                                                <strong>

                                                    ${
                                                        internship.stipend ||
                                                        "Unpaid"
                                                    }

                                                </strong>

                                            </div>


                                        </div>


                                        <div class="description">

                                            ${
                                                internship.description ||
                                                "No description provided."
                                            }

                                        </div>


                                        <div class="skills">


                                            ${
                                                skills.length > 0

                                                    ? skills
                                                        .map(
                                                            skill =>
                                                                `
                                                                <span class="skill">
                                                                    ${skill}
                                                                </span>
                                                                `
                                                        )
                                                        .join("")

                                                    : `
                                                        <span class="skill">
                                                            No skills specified
                                                        </span>
                                                      `
                                            }


                                        </div>


                                        <div class="deadline">


                                            <strong>
                                                Application Deadline:
                                            </strong>


                                            ${deadlineDate}


                                            <br>


                                            <strong>
                                                Posted:
                                            </strong>


                                            ${createdDate}


                                        </div>


                                    </div>

                                `;

                            }
                        ).join("")}


                    </div>

                `;


            } catch (error) {


                console.error(
                    "LOAD INTERNSHIPS ERROR:",
                    error
                );


                container.innerHTML = `

                    <div class="error-message">

                        Unable to connect to the server.

                        <br><br>

                        Please try again.

                        <br><br>

                        <button
                            onclick="loadInternships()"
                            style="
                                width:auto;
                                padding:10px 18px;
                                background:#7c3aed;
                                color:white;
                                border:none;
                                border-radius:8px;
                                cursor:pointer;
                            ">

                            Try Again

                        </button>

                    </div>

                `;

            }

        }


        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );


            window.location.href =
                "login.html";

        }


        // =========================================
        // START
        // =========================================

        loadInternships();


    </script>


</body>

</html>
