<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Internships - INTERNZO</title>

    <link rel="stylesheet"
        href="css/dashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {
            margin-bottom: 35px;
        }

        .page-label {
            color: #8b5cf6;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        .page-header h1 {
            color: #ffffff;

            font-size: clamp(36px, 5vw, 48px);

            line-height: 1.05;

            letter-spacing: -1.5px;

            margin-bottom: 12px;
        }

        .page-header h1 span {
            color: #8b5cf6;
        }

        .page-header p {
            color: #a1a1aa;

            font-size: 15px;

            line-height: 1.6;
        }


        /* =========================================
           INTERNSHIP LIST
        ========================================= */

        .internship-list {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;

        }


        /* =========================================
           INTERNSHIP CARD
        ========================================= */

        .internship-card {

            display: flex;

            flex-direction: column;

            min-width: 0;

            padding: 25px;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.20);

            transition: 0.25s ease;

            animation:
                cardAppear 0.35s ease both;

        }


        .internship-card:hover {

            transform:
                translateY(-5px);

            border-color:
                rgba(124, 58, 237, 0.40);

            box-shadow:
                0 20px 55px
                rgba(0, 0, 0, 0.35);

        }


        /* =========================================
           CARD TOP
        ========================================= */

        .internship-top {

            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            gap: 15px;

            margin-bottom: 20px;

        }


        .internship-title {

            color: #ffffff;

            font-size: 19px;

            font-weight: 700;

            line-height: 1.35;

            margin-bottom: 7px;

        }


        .company-name {

            color: #8b5cf6;

            font-size: 13px;

            font-weight: 600;

        }


        /* =========================================
           STATUS
        ========================================= */

        .status {

            flex-shrink: 0;

            display: inline-flex;

            align-items: center;

            padding:
                6px 11px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;

            white-space: nowrap;

            text-transform:
                capitalize;

        }


        .status.pending {

            background:
                rgba(245, 158, 11, 0.12);

            color: #fbbf24;

            border:
                1px solid
                rgba(245, 158, 11, 0.18);

        }


        .status.approved {

            background:
                rgba(34, 197, 94, 0.12);

            color: #4ade80;

            border:
                1px solid
                rgba(34, 197, 94, 0.18);

        }


        .status.rejected {

            background:
                rgba(239, 68, 68, 0.12);

            color: #f87171;

            border:
                1px solid
                rgba(239, 68, 68, 0.18);

        }


        /* =========================================
           DETAILS GRID
        ========================================= */

        .details {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            margin-bottom: 20px;

        }


        .detail-box {

            padding: 12px;

            background: #0d0d0d;

            border:
                1px solid
                rgba(255, 255, 255, 0.06);

            border-radius: 11px;

        }


        .detail-box span {

            display: block;

            color: #71717a;

            font-size: 10px;

            font-weight: 600;

            text-transform:
                uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 5px;

        }


        .detail-box strong {

            display: block;

            color: #d4d4d8;

            font-size: 13px;

            font-weight: 600;

            line-height: 1.4;

            word-break: break-word;

        }


        /* =========================================
           DESCRIPTION
        ========================================= */

        .description {

            color: #a1a1aa;

            font-size: 13px;

            line-height: 1.7;

            margin-bottom: 18px;

            display: -webkit-box;

            -webkit-line-clamp: 4;

            -webkit-box-orient: vertical;

            overflow: hidden;

        }


        /* =========================================
           SKILLS
        ========================================= */

        .skills {

            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-bottom: 20px;

        }


        .skill {

            display: inline-block;

            padding:
                5px 9px;

            background:
                rgba(124, 58, 237, 0.12);

            color: #a78bfa;

            border:
                1px solid
                rgba(124, 58, 237, 0.18);

            border-radius: 7px;

            font-size: 11px;

            font-weight: 600;

        }


        /* =========================================
           DEADLINE
        ========================================= */

        .deadline {

            margin-top: auto;

            padding-top: 15px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.07);

            color: #71717a;

            font-size: 12px;

            line-height: 2;

        }


        .deadline strong {

            color: #a1a1aa;

            font-weight: 600;

        }


        /* =========================================
           EMPTY STATE
        ========================================= */

        .empty-state {

            width: 100%;

            padding:
                70px 25px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #0b0b0b
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.20);

            animation:
                cardAppear 0.35s ease both;

        }


        .empty-icon {

            width: 65px;

            height: 65px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin:
                0 auto 18px;

            background:
                rgba(124, 58, 237, 0.12);

            color: #8b5cf6;

            border:
                1px solid
                rgba(124, 58, 237, 0.18);

            border-radius: 50%;

            font-size: 27px;

        }


        .empty-state h2 {

            color: #ffffff;

            font-size: 20px;

            margin-bottom: 8px;

        }


        .empty-state p {

            color: #71717a;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 22px;

        }


        .empty-state a {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            min-height: 44px;

            padding:
                0 20px;

            background: #7c3aed;

            color: #ffffff;

            text-decoration: none;

            border-radius: 11px;

            font-size: 13px;

            font-weight: 700;

            transition: 0.2s ease;

        }


        .empty-state a:hover {

            background: #6d28d9;

            transform:
                translateY(-2px);

        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            padding:
                70px 20px;

            text-align: center;

            color: #71717a;

            font-size: 14px;

        }


        .loading i {

            display: block;

            margin-bottom: 12px;

            color: #8b5cf6;

            font-size: 25px;

        }


        /* =========================================
           ERROR
        ========================================= */

        .error-message {

            padding: 25px;

            background:
                rgba(239, 68, 68, 0.07);

            color: #f87171;

            border:
                1px solid
                rgba(239, 68, 68, 0.15);

            border-radius: 15px;

            text-align: center;

            font-size: 14px;

            line-height: 1.6;

        }


        .retry-btn {

            width: auto;

            min-height: 42px;

            padding:
                0 18px;

            margin-top: 15px;

            background: #7c3aed;

            color: #ffffff;

            border: none;

            border-radius: 10px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .retry-btn:hover {

            background: #6d28d9;

            transform:
                translateY(-2px);

        }


        /* =========================================
           ANIMATION
        ========================================= */

        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(10px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 800px) {

            .internship-list {

                grid-template-columns: 1fr;

            }

        }


        @media (max-width: 550px) {

            .internship-top {

                flex-direction: column;

            }

            .status {

                align-self: flex-start;

            }

            .details {

                grid-template-columns: 1fr;

            }

            .page-header h1 {

                font-size: 36px;

            }

            .internship-card {

                padding: 20px;

            }

        }


        @media (max-width: 380px) {

            .page-header h1 {

                font-size: 32px;

            }

            .internship-card {

                padding: 18px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            INTERNZO
        </div>


        <div class="nav-links">

            <a href="company-dashboard.html">
                Dashboard
            </a>


            <a href="post-internship.html">
                Post Internship
            </a>


            <a
                href="manage-internships.html"
                class="active">

                My Internships

            </a>


            <a href="company-applications.html">
                Applications
            </a>


            <a href="company-profile.html">
                Profile
            </a>


            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <!-- =========================================
         MAIN CONTENT
    ========================================= -->

    <main class="dashboard-container">


        <!-- PAGE HEADER -->

        <div class="page-header">

            <div class="page-label">
                COMPANY PORTAL
            </div>

            <h1>
                My <span>Internships</span>
            </h1>

            <p>
                Manage and monitor the internships posted by your company.
            </p>

        </div>


        <!-- =========================================
             INTERNSHIP CONTENT
        ========================================= -->

        <div id="internshipContainer">

            <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                Loading internships...

            </div>

        </div>

    </main>


    <!-- =========================================
         API HELPER
    ========================================= -->

    <script src="js/api.js"></script>


    <script>

        // =========================================
        // CHECK LOGIN
        // =========================================

        const token =
            localStorage.getItem("token");

        const userData =
            localStorage.getItem("user");


        if (!token || !userData) {

            window.location.href =
                "login.html";

        }


        // =========================================
        // USER
        // =========================================

        let user = null;


        try {

            user =
                JSON.parse(userData);

        } catch (error) {

            console.error(
                "User data error:",
                error
            );

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "login.html";

        }


        // =========================================
        // CHECK COMPANY ROLE
        // =========================================

        if (
            user &&
            user.role !== "company"
        ) {

            if (user.role === "student") {

                window.location.href =
                    "student-dashboard.html";

            } else if (
                user.role === "admin"
            ) {

                window.location.href =
                    "admin-dashboard.html";

            } else {

                window.location.href =
                    "login.html";

            }

        }


        // =========================================
        // LOAD INTERNSHIPS
        // =========================================

        async function loadInternships() {

            const container =
                document.getElementById(
                    "internshipContainer"
                );


            container.innerHTML = `

                <div class="loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Loading internships...

                </div>

            `;


            try {

                // =================================
                // API REQUEST
                // =================================

                const data =
                    await apiFetch(
                        "/api/internships/my-internships"
                    );


                // =================================
                // NO INTERNSHIPS
                // =================================

                if (
                    !Array.isArray(data) ||
                    data.length === 0
                ) {

                    container.innerHTML = `

                        <div class="empty-state">

                            <div class="empty-icon">

                                <i class="fa-solid fa-briefcase"></i>

                            </div>


                            <h2>
                                No Internships Posted
                            </h2>


                            <p>
                                You haven't posted any internships yet.
                            </p>


                            <a href="post-internship.html">

                                <i class="fa-solid fa-plus"></i>

                                Post Your First Internship

                            </a>

                        </div>

                    `;

                    return;

                }


                // =================================
                // DISPLAY INTERNSHIPS
                // =================================

                container.innerHTML = `

                    <div class="internship-list">

                        ${data.map(
                            function(internship) {

                                // =============================
                                // CREATED DATE
                                // =============================

                                const createdDate =
                                    formatDate(
                                        internship.createdAt
                                    );


                                // =============================
                                // DEADLINE DATE
                                // =============================

                                const deadlineDate =
                                    formatDate(
                                        internship.deadline
                                    );


                                // =============================
                                // STATUS
                                // =============================

                                const rawStatus =
                                    internship.status ||
                                    "Pending";


                                const status =
                                    String(
                                        rawStatus
                                    ).toLowerCase();


                                // =============================
                                // SKILLS
                                // =============================

                                const skills =
                                    Array.isArray(
                                        internship.skills
                                    )
                                        ? internship.skills
                                        : [];


                                // =============================
                                // SKILL HTML
                                // =============================

                                const skillsHTML =
                                    skills.length > 0

                                        ? skills
                                            .map(
                                                function(skill) {

                                                    return `

                                                        <span class="skill">

                                                            ${escapeHTML(
                                                                skill
                                                            )}

                                                        </span>

                                                    `;

                                                }
                                            )
                                            .join("")

                                        : `

                                            <span class="skill">
                                                No skills specified
                                            </span>

                                          `;


                                // =============================
                                // CARD
                                // =============================

                                return `

                                    <article
                                        class="internship-card">


                                        <div
                                            class="internship-top">


                                            <div>

                                                <div
                                                    class="internship-title">

                                                    ${escapeHTML(
                                                        internship.title ||
                                                        "Untitled Internship"
                                                    )}

                                                </div>


                                                <div
                                                    class="company-name">

                                                    ${escapeHTML(
                                                        internship.companyName ||
                                                        "Company"
                                                    )}

                                                </div>

                                            </div>


                                            <div
                                                class="status ${getStatusClass(status)}">

                                                ${escapeHTML(
                                                    rawStatus
                                                )}

                                            </div>


                                        </div>


                                        <!-- DETAILS -->

                                        <div
                                            class="details">


                                            <div
                                                class="detail-box">

                                                <span>
                                                    Location
                                                </span>

                                                <strong>

                                                    ${escapeHTML(
                                                        internship.location ||
                                                        "Not specified"
                                                    )}

                                                </strong>

                                            </div>


                                            <div
                                                class="detail-box">

                                                <span>
                                                    Type
                                                </span>

                                                <strong>

                                                    ${escapeHTML(
                                                        internship.type ||
                                                        "Not specified"
                                                    )}

                                                </strong>

                                            </div>


                                            <div
                                                class="detail-box">

                                                <span>
                                                    Duration
                                                </span>

                                                <strong>

                                                    ${escapeHTML(
                                                        internship.duration ||
                                                        "Not specified"
                                                    )}

                                                </strong>

                                            </div>


                                            <div
                                                class="detail-box">

                                                <span>
                                                    Stipend
                                                </span>

                                                <strong>

                                                    ${escapeHTML(
                                                        internship.stipend ||
                                                        "Unpaid"
                                                    )}

                                                </strong>

                                            </div>


                                        </div>


                                        <!-- DESCRIPTION -->

                                        <div
                                            class="description">

                                            ${escapeHTML(
                                                internship.description ||
                                                "No description provided."
                                            )}

                                        </div>


                                        <!-- SKILLS -->

                                        <div
                                            class="skills">

                                            ${skillsHTML}

                                        </div>


                                        <!-- DATES -->

                                        <div
                                            class="deadline">


                                            <strong>
                                                Application Deadline:
                                            </strong>

                                            ${deadlineDate}


                                            <br>


                                            <strong>
                                                Posted:
                                            </strong>

                                            ${createdDate}


                                        </div>


                                    </article>

                                `;

                            }
                        ).join("")}

                    </div>

                `;


            } catch (error) {

                console.error(
                    "LOAD INTERNSHIPS ERROR:",
                    error
                );


                container.innerHTML = `

                    <div class="error-message">

                        <i
                            class="fa-solid fa-triangle-exclamation"
                            style="
                                display:block;
                                font-size:24px;
                                margin-bottom:12px;
                            ">
                        </i>


                        Unable to connect to the INTERNZO server.


                        <br>

                        <span
                            style="
                                color:#71717a;
                                font-size:13px;
                            ">

                            Please try again.

                        </span>


                        <br>


                        <button
                            class="retry-btn"
                            onclick="loadInternships()">

                            <i class="fa-solid fa-rotate-right"></i>

                            Try Again

                        </button>

                    </div>

                `;

            }

        }


        // =========================================
        // FORMAT DATE
        // =========================================

        function formatDate(dateValue) {

            if (!dateValue) {

                return "N/A";

            }


            const date =
                new Date(dateValue);


            if (
                isNaN(
                    date.getTime()
                )
            ) {

                return "N/A";

            }


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        // =========================================
        // STATUS CLASS
        // =========================================

        function getStatusClass(status) {

            if (
                status === "approved"
            ) {

                return "approved";

            }


            if (
                status === "rejected"
            ) {

                return "rejected";

            }


            return "pending";

        }


        // =========================================
        // ESCAPE HTML
        // =========================================

        function escapeHTML(value) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                String(value);

            return div.innerHTML;

        }


        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );


            window.location.href =
                "login.html";

        }


        // =========================================
        // START
        // =========================================

        loadInternships();

    </script>

</body>

</html>
